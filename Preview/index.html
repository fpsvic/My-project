<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Human Figure — Desktop Preview</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at 30% 20%, #2d3a5c, #0f1118 70%);
      font-family: system-ui, sans-serif;
      color: #e8ecf4;
    }
    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.45);
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
      pointer-events: none;
      z-index: 2;
    }
    #status { color: #9fb4ff; }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="hud">
    <strong>Human Figure</strong> — desktop preview<br />
    <span id="status">Loading model…</span><br />
    <small>Drag rotate · Scroll zoom · Right-drag pan</small>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const status = document.getElementById('status');
    const modelUrl = '../Assets/Models/HumanFigure.glb';

    const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x0f1118, 8, 24);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.05, 100);
    camera.position.set(0, 1.4, 3.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1, 0);
    controls.enableDamping = true;
    controls.update();

    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    const key = new THREE.DirectionalLight(0xffffff, 1.1);
    key.position.set(3, 6, 4);
    scene.add(key);
    const fill = new THREE.DirectionalLight(0xaec6ff, 0.35);
    fill.position.set(-4, 2, -2);
    scene.add(fill);

    const grid = new THREE.GridHelper(10, 20, 0x445577, 0x2a3344);
    grid.position.y = 0;
    scene.add(grid);

    const loader = new GLTFLoader();
    loader.load(
      modelUrl,
      (gltf) => {
        const root = gltf.scene;
        scene.add(root);

        const box = new THREE.Box3().setFromObject(root);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        root.position.sub(center);
        root.position.y += size.y * 0.5;

        const maxDim = Math.max(size.x, size.y, size.z);
        const dist = maxDim * 1.6;
        camera.position.set(0, size.y * 0.55, dist);
        controls.target.set(0, size.y * 0.45, 0);
        controls.update();

        status.textContent = 'Model loaded — same asset used in Unity SampleScene';
      },
      (event) => {
        if (event.total) {
          status.textContent = `Loading… ${Math.round((event.loaded / event.total) * 100)}%`;
        }
      },
      (error) => {
        console.error(error);
        status.textContent = 'Failed to load model. Is the preview server running from /workspace?';
      }
    );

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener('resize', onResize);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
