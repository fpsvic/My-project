<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polyglot Academy</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-[#09090b] text-[#e4e4e7] flex flex-col h-screen overflow-hidden selection:bg-blue-500/30">

  <nav class="h-14 bg-[#18181b] border-b border-zinc-800 flex items-center px-4 shrink-0 shadow-sm z-20">
    <button id="sidebar-toggle" class="mr-4 text-zinc-400 hover:text-white transition-colors flex items-center justify-center w-8 h-8 rounded-md hover:bg-zinc-800/50" title="Toggle Sidebar">
      <i class="fa-solid fa-bars"></i>
    </button>
    <div class="flex items-center gap-2 font-bold text-white tracking-wide w-48 flex-shrink-0">
      <i class="fa-solid fa-bookmark text-blue-500 text-lg"></i> Polyglot
    </div>
    <div id="nav-tabs" class="flex-1 flex items-center overflow-x-auto custom-scrollbar h-full gap-1 ml-4">
      <!-- Nav tabs injected via JS -->
    </div>
  </nav>

  <div class="flex flex-1 overflow-hidden relative">
    
    <!-- Sidebar -->
    <aside id="sidebar" class="w-64 bg-[#0e0e11] border-r border-zinc-800 flex flex-col flex-shrink-0 z-10 shadow-[4px_0_24px_rgba(0,0,0,0.2)] transition-all duration-300">
      <div class="p-5 border-b border-zinc-800/50 bg-[#121214]">
        <h3 id="sidebar-title" class="text-xs font-bold text-zinc-500 uppercase tracking-widest">Curriculum</h3>
      </div>
      <div id="sidebar-content" class="flex-1 overflow-y-auto p-3 space-y-6 custom-scrollbar">
        <!-- Sidebar content injected via JS -->
      </div>
    </aside>

    <!-- Main Workspace -->
    <main id="main-workspace" class="flex-1 flex flex-col min-w-0 bg-[#09090b] overflow-y-auto custom-scrollbar relative">
      
      <!-- Lesson Content -->
      <div class="px-8 py-10 lg:px-12 lg:py-12 flex-shrink-0">
        <div class="max-w-4xl mx-auto pb-4" id="lesson-content">
          <!-- Lesson text injected via JS -->
        </div>
      </div>

      <!-- Editor & Terminal -->
      <div class="mx-8 lg:mx-12 mb-16 rounded-xl border border-zinc-800 bg-[#18181b] shadow-2xl flex flex-col overflow-hidden flex-shrink-0 h-[500px] max-w-5xl xl:mx-auto xl:w-full relative z-0">
        
        <div class="flex items-center justify-between px-4 h-12 bg-[#121214] border-b border-zinc-800">
          <div id="editor-tab" class="flex items-center gap-2 text-xs text-zinc-400 font-mono bg-zinc-800/40 px-3 py-1.5 rounded-md border border-zinc-700/50">
            <!-- File name injected via JS -->
          </div>
          <div class="flex items-center gap-3" id="editor-actions">
            <!-- Run/Next buttons injected via JS -->
          </div>
        </div>
          
        <textarea id="code-editor" class="flex-[2] w-full p-4 bg-[#18181b] text-zinc-300 font-mono text-sm leading-relaxed resize-none outline-none custom-scrollbar focus:bg-[#1a1a1e] transition-colors" spellcheck="false"></textarea>

        <div class="flex-[1] flex flex-col bg-[#09090b] border-t border-zinc-800 min-h-[120px]">
          <div class="px-4 py-2 bg-[#121214] border-b border-zinc-800/80 text-[10px] text-zinc-500 font-bold uppercase tracking-widest flex items-center gap-2">
              <i class="fa-solid fa-terminal"></i> Console Output
          </div>
          <div id="terminal-output" class="flex-1 p-4 font-mono text-sm overflow-y-auto custom-scrollbar">
            <!-- Terminal text injected via JS -->
          </div>
        </div>
      </div>
      
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
