<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Top-Down Soccer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>⚽ Top-Down Soccer</h1>

<div id="ui">
  <div class="team-badge team-you">YOU</div>
  <span id="score">0 — 0</span>
  <div class="team-badge team-ai">AI</div>
  <span id="timer">2:00</span>
</div>
<div id="staminaBar">
  <span>Stamina</span>
  <div id="staminaTrack"><div id="staminaFill"></div></div>
</div>

<div class="wrapper">
  <canvas id="gameCanvas" width="800" height="520"></canvas>
  <div id="overlay">
    <h2>⚽ Kick Off!</h2>
    <p>Get Ready...</p>
  </div>
</div>

<div id="controls">
  WASD / Arrows — Move &nbsp;<span>|</span>&nbsp;
  Hold Space — Power Shot &nbsp;<span>|</span>&nbsp;
  Enter — Restart
</div>

<script src="physics.js"></script>
<script src="characters.js"></script>
<script>
const canvas  = document.getElementById('gameCanvas');
const ctx     = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const scoreEl = document.getElementById('score');
const timerEl = document.getElementById('timer');
const staminaFill = document.getElementById('staminaFill');

const W = canvas.width, H = canvas.height;
const CX = W / 2, CY = H / 2;
const MATCH_TIME = 120;

// ——— Team configs ———
const PLAYER_CFG = { jersey: '#1db954', shorts: '#fff',    skin: SKIN[0], num: 10 };
const TM_CFGS = [
  { jersey: '#1db954', shorts: '#fff',    skin: SKIN[1], num: 5 },
  { jersey: '#1db954', shorts: '#fff',    skin: SKIN[2], num: 7 },
  { jersey: '#f5c300', shorts: '#1db954', skin: SKIN[0], num: 1 },  // GK
];
const AI_CFGS = [
  { jersey: '#e63946', shorts: '#111',    skin: SKIN[3], num: 9 },
  { jersey: '#e63946', shorts: '#111',    skin: SKIN[2], num: 4 },
  { jersey: '#e63946', shorts: '#111',    skin: SKIN[1], num: 6 },
  { jersey: '#ff7700', shorts: '#e63946', skin: SKIN[2], num: 1 },  // GK
];

let state, keys = {};

function mkE(x, y, role) {
  return { x, y, vx: 0, vy: 0, role, angle: Math.PI / 2, kickCooldown: 0, stamina: 1.0 };
}

// ——— Init ———
function initGame() {
  state = {
    time: MATCH_TIME,
    score: [0, 0],
    phase: 'kickoff',
    phaseTimer: 2.2,
    goalFlash: 0,
    goalTeam: -1,
    powerCharge: 0,
    ball: { x: CX, y: CY, vx: 0, vy: 0 },
    player: mkE(CX - 90, CY, 'player'),
    teammates: [
      mkE(CX - 210, CY - 95, 'defender'),
      mkE(CX - 210, CY + 95, 'defender'),
      mkE(FIELD.x + 24, CY, 'keeper'),
    ],
    ai: [
      mkE(CX + 90,  CY,      'forward'),
      mkE(CX + 210, CY - 95, 'defender'),
      mkE(CX + 210, CY + 95, 'defender'),
      mkE(FIELD.x + FIELD.w - 24, CY, 'keeper'),
    ],
  };
  updateUI();
  showOverlay('⚽ Kick Off!', 'Get Ready…');
}

function resetPositions() {
  const b = state.ball;
  b.x = CX; b.y = CY; b.vx = 0; b.vy = 0;

  const resets = [
    [state.player,       CX - 90,  CY],
    [state.teammates[0], CX - 210, CY - 95],
    [state.teammates[1], CX - 210, CY + 95],
    [state.teammates[2], FIELD.x + 24, CY],
    [state.ai[0],        CX + 90,  CY],
    [state.ai[1],        CX + 210, CY - 95],
    [state.ai[2],        CX + 210, CY + 95],
    [state.ai[3],        FIELD.x + FIELD.w - 24, CY],
  ];
  for (const [e, x, y] of resets) {
    e.x = x; e.y = y; e.vx = 0; e.vy = 0; e.kickCooldown = 0;
  }
}

function allEntities() {
  return [state.player, ...state.teammates, ...state.ai];
}

// ——— Input ———
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Enter') initGame();
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

// ——— Player update ———
const STAMINA_DRAIN  = 0.28;   // per second while sprinting
const STAMINA_REGEN  = 0.14;   // per second while not
const STAMINA_MIN    = 0.15;   // can't sprint below this

function updatePlayer(dt) {
  const p   = state.player;
  let dx = 0, dy = 0;
  if (keys['KeyW'] || keys['ArrowUp'])    dy -= 1;
  if (keys['KeyS'] || keys['ArrowDown'])  dy += 1;
  if (keys['KeyA'] || keys['ArrowLeft'])  dx -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) dx += 1;

  const wantSprint = keys['Space'] && (dx || dy);
  const canSprint  = p.stamina > STAMINA_MIN;
  const sprinting  = wantSprint && canSprint;

  // Stamina
  if (sprinting) {
    p.stamina = Math.max(0, p.stamina - STAMINA_DRAIN * dt);
  } else {
    p.stamina = Math.min(1, p.stamina + STAMINA_REGEN * dt);
  }

  // Power shot charge (hold Space while standing still near ball)
  const nearBall = dist(p, state.ball) < PLAYER_R + BALL_R + 20;
  if (keys['Space'] && !sprinting && nearBall) {
    state.powerCharge = Math.min(1, (state.powerCharge || 0) + dt * 1.4);
  } else if (!keys['Space'] && state.powerCharge > 0.1) {
    // Release power shot
    const power = 8 + state.powerCharge * 9;
    tryKick(p, state.ball, power, dt);
    state.ball.kickCooldown = 0; // force the kick
    state.powerCharge = 0;
    p.kickCooldown = 0;
    tryKick(p, state.ball, power, dt);
  } else if (!keys['Space']) {
    state.powerCharge = 0;
  }

  const topSpeed = sprinting ? 6.2 : 4.2;
  const accel    = sprinting ? 1.3 : 1.0;

  if (dx || dy) {
    const [nx, ny] = norm(dx, dy);
    p.vx += nx * accel;
    p.vy += ny * accel;
    capSpeed(p, topSpeed);
  } else {
    p.vx *= 0.74;
    p.vy *= 0.74;
    if (Math.abs(p.vx) < 0.08) p.vx = 0;
    if (Math.abs(p.vy) < 0.08) p.vy = 0;
  }

  p.x += p.vx;
  p.y += p.vy;
  clampField(p, PLAYER_R);

  if (state.powerCharge <= 0.1) {
    const kickPwr = sprinting ? 11 : 7.5;
    tryKick(p, state.ball, kickPwr, dt);
  }

  // Update UI stamina bar
  staminaFill.style.width = (p.stamina * 100) + '%';
  staminaFill.style.background = p.stamina > 0.5 ? '#1db954'
    : p.stamina > 0.25 ? '#f0a500' : '#e63946';
}

// ——— AI helpers ———
function moveAgent(a, tx, ty, topSpeed) {
  const dx = tx - a.x, dy = ty - a.y;
  if (Math.hypot(dx, dy) < 2) return;
  const [nx, ny] = norm(dx, dy);
  a.vx += nx * 0.75;
  a.vy += ny * 0.75;
  capSpeed(a, topSpeed);
  a.x += a.vx; a.y += a.vy;
  a.vx *= 0.80; a.vy *= 0.80;
  clampField(a, PLAYER_R);
}

// Predict where ball will be after `ticks` frames
function predictBall(ball, ticks) {
  let bx = ball.x, by = ball.y, bvx = ball.vx, bvy = ball.vy;
  for (let i = 0; i < ticks; i++) {
    bvx *= BALL_FRICTION; bvy *= BALL_FRICTION;
    bx += bvx; by += bvy;
  }
  return { x: bx, y: by };
}

function updateAI(dt) {
  const b = state.ball;

  state.ai.forEach((a, i) => {
    let tx, ty, spd;

    if (a.role === 'keeper') {
      // Track ball Y, stay on goal line unless ball is in penalty area
      tx = FIELD.x + FIELD.w - 30;
      const inBox = b.x > FIELD.x + FIELD.w - 90;
      if (inBox) { tx = b.x - 20; }
      ty = Math.max(CY - GOAL_W / 2 + 14, Math.min(CY + GOAL_W / 2 - 14, b.y));
      spd = 4.0;
    } else if (a.role === 'forward') {
      // Intercept predicted ball position
      const ticks = Math.max(4, Math.floor(dist(a, b) / 3.5));
      const pred  = predictBall(b, ticks);
      tx = Math.max(CX, pred.x);
      ty = pred.y;
      // If we have the ball, go toward enemy goal
      if (dist(a, b) < PLAYER_R + BALL_R + 5) {
        tx = FIELD.x + 40; ty = CY;
      }
      spd = 3.6;
    } else {
      // Defenders: press ball in own half, hold shape otherwise
      if (b.x > CX - 40) {
        const ticks = Math.max(4, Math.floor(dist(a, b) / 3));
        const pred  = predictBall(b, ticks);
        tx = pred.x; ty = pred.y; spd = 3.1;
      } else {
        tx = CX + 190; ty = i === 1 ? CY - 95 : CY + 95; spd = 1.6;
      }
    }

    moveAgent(a, tx, ty, spd);

    if (tryKick(a, b, a.role === 'keeper' ? 9 : 10, dt)) {
      // Aim toward player's goal with slight spread
      const spread = a.role === 'forward' ? 30 : 55;
      const aimY   = CY + (Math.random() - 0.5) * spread;
      const [nx, ny] = norm(FIELD.x - b.x, aimY - b.y);
      b.vx = nx * (a.role === 'forward' ? 10 : 9);
      b.vy = ny * (a.role === 'forward' ? 10 : 9);
      a.kickCooldown = KICK_COOLDOWN;
    }
  });

  state.teammates.forEach((t, i) => {
    let tx, ty, spd;

    if (t.role === 'keeper') {
      tx = FIELD.x + 30;
      const inBox = b.x < FIELD.x + 90;
      if (inBox) { tx = b.x + 20; }
      ty = Math.max(CY - GOAL_W / 2 + 14, Math.min(CY + GOAL_W / 2 - 14, b.y));
      spd = 3.8;
    } else {
      if (b.x < CX + 40) {
        const ticks = Math.max(4, Math.floor(dist(t, b) / 3));
        const pred  = predictBall(b, ticks);
        tx = pred.x; ty = pred.y; spd = 3.0;
      } else {
        tx = CX - 190; ty = i === 0 ? CY - 95 : CY + 95; spd = 1.6;
      }
    }

    moveAgent(t, tx, ty, spd);

    if (tryKick(t, b, 9, dt)) {
      const spread = 35;
      const aimY   = CY + (Math.random() - 0.5) * spread;
      const [nx, ny] = norm((FIELD.x + FIELD.w) - b.x, aimY - b.y);
      b.vx = nx * 9;
      b.vy = ny * 9;
      t.kickCooldown = KICK_COOLDOWN;
    }
  });

  // Separate all players
  const all = allEntities();
  for (let i = 0; i < all.length; i++)
    for (let j = i + 1; j < all.length; j++)
      separateCircles(all[i], all[j]);
}

// ——— Score / UI ———
function doScore(team) {
  state.score[team]++;
  state.phase     = 'goal';
  state.phaseTimer = 3.0;
  state.goalFlash  = 1.0;
  state.goalTeam   = team;
  updateUI();
  showOverlay(
    team === 0 ? '🎉 GOAL!' : '😬 GOAL!',
    team === 0 ? 'You scored!' : 'AI scored!'
  );
}

function showOverlay(title, sub) {
  overlay.innerHTML = `<h2>${title}</h2><p>${sub}</p>`;
  overlay.style.display = 'flex';
}

function updateUI() {
  scoreEl.textContent = `${state.score[0]} — ${state.score[1]}`;
  const m = Math.floor(state.time / 60);
  const s = Math.floor(state.time % 60);
  timerEl.textContent = `${m}:${s.toString().padStart(2, '0')}`;
}

// ——— Field ———
function drawField() {
  ctx.fillStyle = '#2d7a3a';
  ctx.fillRect(FIELD.x, FIELD.y, FIELD.w, FIELD.h);

  // Alternating grass stripes
  const sw = FIELD.w / 8;
  ctx.fillStyle = '#2f8040';
  for (let i = 0; i < 8; i += 2)
    ctx.fillRect(FIELD.x + i * sw, FIELD.y, sw, FIELD.h);

  ctx.strokeStyle = 'rgba(255,255,255,0.88)';
  ctx.lineWidth = 2.5;
  ctx.strokeRect(FIELD.x, FIELD.y, FIELD.w, FIELD.h);

  // Halfway line
  ctx.beginPath();
  ctx.moveTo(CX, FIELD.y); ctx.lineTo(CX, FIELD.y + FIELD.h);
  ctx.stroke();

  // Center circle
  ctx.beginPath(); ctx.arc(CX, CY, 60, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = 'white';
  ctx.beginPath(); ctx.arc(CX, CY, 3.5, 0, Math.PI * 2); ctx.fill();

  // Penalty areas
  ctx.strokeStyle = 'rgba(255,255,255,0.7)';
  ctx.lineWidth = 1.8;
  ctx.strokeRect(FIELD.x, CY - 105, 95, 210);
  ctx.strokeRect(FIELD.x + FIELD.w - 95, CY - 105, 95, 210);

  // Penalty arc (D)
  ctx.beginPath(); ctx.arc(FIELD.x + 65, CY, 40, -Math.PI * 0.65, Math.PI * 0.65); ctx.stroke();
  ctx.beginPath(); ctx.arc(FIELD.x + FIELD.w - 65, CY, 40, Math.PI * 0.35, Math.PI * 1.65); ctx.stroke();

  // Penalty spots
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.beginPath(); ctx.arc(FIELD.x + 65, CY, 3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(FIELD.x + FIELD.w - 65, CY, 3, 0, Math.PI * 2); ctx.fill();

  const gTop = CY - GOAL_W / 2, gBot = CY + GOAL_W / 2;

  // Goal nets
  ctx.fillStyle = 'rgba(255,255,255,0.07)';
  ctx.fillRect(FIELD.x - GOAL_D, gTop, GOAL_D, GOAL_W);
  ctx.fillRect(FIELD.x + FIELD.w, gTop, GOAL_D, GOAL_W);
  // Net grid
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 0.8;
  for (let yy = gTop; yy <= gBot; yy += 15) {
    ctx.beginPath(); ctx.moveTo(FIELD.x - GOAL_D, yy); ctx.lineTo(FIELD.x, yy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(FIELD.x + FIELD.w, yy); ctx.lineTo(FIELD.x + FIELD.w + GOAL_D, yy); ctx.stroke();
  }
  for (let xx = 0; xx < GOAL_D; xx += 10) {
    ctx.beginPath(); ctx.moveTo(FIELD.x - GOAL_D + xx, gTop); ctx.lineTo(FIELD.x - GOAL_D + xx, gBot); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(FIELD.x + FIELD.w + xx, gTop); ctx.lineTo(FIELD.x + FIELD.w + xx, gBot); ctx.stroke();
  }

  // Goal posts
  ctx.strokeStyle = 'white'; ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.moveTo(FIELD.x, gTop); ctx.lineTo(FIELD.x - GOAL_D, gTop);
  ctx.lineTo(FIELD.x - GOAL_D, gBot); ctx.lineTo(FIELD.x, gBot);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(FIELD.x + FIELD.w, gTop); ctx.lineTo(FIELD.x + FIELD.w + GOAL_D, gTop);
  ctx.lineTo(FIELD.x + FIELD.w + GOAL_D, gBot); ctx.lineTo(FIELD.x + FIELD.w, gBot);
  ctx.stroke();

  // Corner arcs
  ctx.strokeStyle = 'rgba(255,255,255,0.65)';
  ctx.lineWidth = 1.5;
  const corners = [[FIELD.x, FIELD.y],[FIELD.x+FIELD.w, FIELD.y],[FIELD.x, FIELD.y+FIELD.h],[FIELD.x+FIELD.w, FIELD.y+FIELD.h]];
  const angles  = [[0, Math.PI/2],[Math.PI/2, Math.PI],[3*Math.PI/2, 2*Math.PI],[Math.PI, 3*Math.PI/2]];
  corners.forEach(([cx, cy], idx) => {
    ctx.beginPath();
    ctx.arc(cx, cy, 14, angles[idx][0], angles[idx][1]);
    ctx.stroke();
  });
}

// ——— Power shot charge ring ———
function drawPowerCharge() {
  if (!state.powerCharge || state.powerCharge < 0.05) return;
  const p = state.player;
  const r = PLAYER_R + 8 + state.powerCharge * 8;
  ctx.save();
  ctx.globalAlpha = 0.8 * state.powerCharge;
  ctx.strokeStyle = `hsl(${60 - state.powerCharge * 60}, 100%, 60%)`;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(p.x, p.y, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * state.powerCharge);
  ctx.stroke();
  ctx.restore();
}

// ——— Goal flash ———
function drawGoalFlash() {
  if (state.goalFlash <= 0) return;
  const color = state.goalTeam === 0 ? '#88ff88' : '#ff6666';
  ctx.save();
  ctx.globalAlpha = state.goalFlash * 0.25;
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
  state.goalFlash -= 0.022;
}

// ——— Main loop ———
let last = 0;
function loop(ts) {
  const dt = Math.min((ts - last) / 1000, 0.05);
  last = ts;

  ctx.fillStyle = '#0f0f1a';
  ctx.fillRect(0, 0, W, H);
  drawField();

  if (state.phase === 'kickoff') {
    state.phaseTimer -= dt;
    if (state.phaseTimer <= 0) { state.phase = 'play'; overlay.style.display = 'none'; }
  } else if (state.phase === 'play') {
    updateCooldowns(allEntities(), dt);
    updatePlayer(dt);
    updateAI(dt);
    const scored = moveBall(state.ball);
    if (scored === 'player') doScore(0);
    else if (scored === 'ai') doScore(1);
    state.time -= dt;
    if (state.time <= 0) {
      state.time = 0; state.phase = 'end';
      const [p, a] = state.score;
      showOverlay(
        p > a ? '🏆 You Win!' : p < a ? '😞 You Lose!' : '🤝 Draw!',
        `Final: ${p} — ${a}  |  Press Enter to restart`
      );
    }
    updateUI();
  } else if (state.phase === 'goal') {
    state.phaseTimer -= dt;
    if (state.phaseTimer <= 0) {
      resetPositions();
      state.phase = 'kickoff';
      state.phaseTimer = 2.0;
      showOverlay('⚽ Kick Off!', 'Get Ready…');
    }
  }

  // Draw teammates (blue)
  state.teammates.forEach((t, i) => {
    const c = TM_CFGS[i];
    drawCharacter(ctx, t.x, t.y, getFacingAngle(t), c.jersey, c.shorts, c.skin, c.num, false);
  });
  // Draw AI (red)
  state.ai.forEach((a, i) => {
    const c = AI_CFGS[i];
    drawCharacter(ctx, a.x, a.y, getFacingAngle(a), c.jersey, c.shorts, c.skin, c.num, false);
  });
  // Draw player (green, with stamina bar)
  const p = state.player;
  drawCharacter(ctx, p.x, p.y, getFacingAngle(p), PLAYER_CFG.jersey, PLAYER_CFG.shorts, PLAYER_CFG.skin, PLAYER_CFG.num, true, p.stamina);

  drawBall(ctx, state.ball);
  drawPowerCharge();
  drawGoalFlash();

  requestAnimationFrame(loop);
}

initGame();
requestAnimationFrame(loop);
</script>
</body>
</html>
