[phases.setup]
nixPkgs = ["nodejs_20", "python311"]

[phases.install]
cmds = [
  "cd forgeai-studio/frontend && npm install",
  "pip install -r forgeai-studio/backend/requirements.txt"
]

[phases.build]
cmds = ["cd forgeai-studio/frontend && npm run build"]

[start]
cmd = "cd forgeai-studio/backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
