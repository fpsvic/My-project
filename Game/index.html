const HALF_CW=CW/2, HALF_CH=CH/2;

// ── Game state machine ─────────────────────────────────────────────────────
// 'title' | 'generating' | 'playing' | 'levelcomplete' | 'victory'
let gameState='title';
let titleTime=0;
let genProgress=0;         // 0-1 shown on generation screen
let worldSeed=0;           // set fresh each new game

// ── Noise ──────────────────────────────────────────────────────────────────
function hash(x,y,s=0){
  let n=x*374761393+y*668265263+(s*1376312589);
  n=(n^(n>>>13))*1274126177; return ((n^(n>>>16))&0x7fffffff)/0x7fffffff;
}
function smoothN(x,y,s){
  let v=0,amp=0.5,freq=1/32;
  for(let o=0;o<6;o++){
    const fx=x*freq,fy=y*freq;
    const ix=Math.floor(fx),iy=Math.floor(fy);
    const tx=fx-ix,ty=fy-iy;
    const u=tx*tx*(3-2*tx),w=ty*ty*(3-2*ty);
    v+=amp*(hash(ix,iy,s)*(1-u)*(1-w)+hash(ix+1,iy,s)*u*(1-w)+
            hash(ix,iy+1,s)*(1-u)*w+hash(ix+1,iy+1,s)*u*w);
    amp*=0.5; freq*=2;
  }
  return v;
}

// ── Tile types ─────────────────────────────────────────────────────────────
const T={
  DEEP_WATER:0,SHALLOW_WATER:1,SAND:2,GRASS:3,DARK_GRASS:4,
  FOREST:5,MOUNTAIN:6,SNOW:7,PATH:8,WALL:9,FLOOR:10,DOOR:11,
  BRIDGE:12,DOCK:13
};
const TCOLOR=['#1a6b9a','#2e8fc0','#d2b48c','#5a9e3a','#3d7a28','#1f5c1a','#8c8c8c','#e8e8f0','#8c7355','#5c4a3a','#b08050','#7a5530','#8B6914','#7a5a20'];
const TWALK=[false,true,true,true,true,false,false,true,true,false,true,true,true,true];

// ── World data (reset each new game) ──────────────────────────────────────
let tiles=new Uint8Array(WW*WH);
let buildings=[];
let docks=[];

// Village centres — randomised per seed (8 centres spread across map)
let CENTRES=[];
function makeCentres(seed){
  // divide map into quadrant grid and pick one point per cell
  const cols=4, rows=2;
  const cw=WW/cols, ch=WH/rows;
  const centres=[];
  let s=seed^0xdeadbeef;
  function r(n){s=((s*1664525+1013904223)>>>0); return (s>>>16)%n;}
  for(let row=0;row<rows;row++){
    for(let col=0;col<cols;col++){
      const mx=col*cw+cw*0.2|0, my=row*ch+ch*0.2|0;
      const rw=cw*0.6|0, rh=ch*0.6|0;
      centres.push([mx+r(rw), my+r(rh)]);
    }
  }
  return centres;
}

function classify(h){
  if(h<0.08)return T.DEEP_WATER;
  if(h<0.17)return T.SHALLOW_WATER;
  if(h<0.23)return T.SAND;
  if(h<0.48)return T.GRASS;
  if(h<0.58)return T.DARK_GRASS;
  if(h<0.70)return T.FOREST;
  if(h<0.80)return T.MOUNTAIN;
  return T.SNOW;
}
function generateWorld(seed){
  const mode=seed%6;
  for(let y=0;y<WH;y++){
    for(let x=0;x<WW;x++){
      const cx=(x/WW-0.5)*2, cy=(y/WH-0.5)*2;
      let falloff;
      if(mode===0)      falloff=Math.sqrt(cx*cx+cy*cy)*0.55;                                         // round island
      else if(mode===1) falloff=Math.sqrt(cx*cx*0.28+cy*cy)*0.65;                                    // east-west ridge
      else if(mode===2){const d1=Math.sqrt((cx+0.55)**2+(cy*1.4)**2),d2=Math.sqrt((cx-0.55)**2+(cy*1.4)**2); falloff=Math.min(d1,d2)*0.72;} // twin islands
      else if(mode===3) falloff=Math.sqrt(cx*cx+cy*cy)*0.20;                                         // large continent
      else if(mode===4) falloff=Math.sqrt(cx*cx+cy*cy*0.22)*0.65;                                    // north-south spine
      else              falloff=Math.sqrt((cx-0.15)**2*0.45+cy*cy)*0.60;                              // offset peninsula
      tiles[y*WW+x]=classify(smoothN(x,y,seed)-falloff);
    }
  }
}
function canPlace(bx,by,bw,bh){
  if(bx<2||by<2||bx+bw>=WW-2||by+bh>=WH-2)return false;
  for(let dy=-1;dy<=bh;dy++)
    for(let dx=-1;dx<=bw;dx++){
      const t=tiles[(by+dy)*WW+(bx+dx)];
      if(!TWALK[t]||t===T.FOREST||t===T.SHALLOW_WATER)return false;
    }
  for(const b of buildings)
    if(bx<b.x+b.w+2&&bx+bw>b.x-2&&by<b.y+b.h+2&&by+bh>b.y-2)return false;
  return true;
}
const BTYPE=['Inn','Shop','Blacksmith','Chapel','Cottage'];
function placeBuildings(seed){
  let s=seed^0x12345;
  function rnd(n){s=((s*1664525+1013904223)>>>0); return (s>>>16)%n;}
  for(const vc of CENTRES){
    const count=2+rnd(4);
    for(let k=0;k<count;k++){
      const w=5+rnd(3)*2, h=5+rnd(3)*2;
      const bx=vc[0]+rnd(16)-8, by=vc[1]+rnd(16)-8;
      if(!canPlace(bx,by,w,h))continue;
      const b={x:bx,y:by,w,h,type:BTYPE[rnd(5)],interior:[]};
      for(let ly=0;ly<h;ly++){
        b.interior[ly]=[];
        for(let lx=0;lx<w;lx++){
          const edge=(lx===0||lx===w-1||ly===0||ly===h-1);
          b.interior[ly][lx]=edge?T.WALL:T.FLOOR;
        }
      }
      b.interior[h-1][Math.floor(w/2)]=T.DOOR;
      buildings.push(b);
    }
  }
}
function worldGet(tx,ty){
  if(tx<0||tx>=WW||ty<0||ty>=WH)return T.DEEP_WATER;
  for(const b of buildings)
    if(tx>=b.x&&tx<b.x+b.w&&ty>=b.y&&ty<b.y+b.h)
      return b.interior[ty-b.y][tx-b.x];
  return tiles[ty*WW+tx];
}
function worldTerrain(tx,ty){
  if(tx<0||tx>=WW||ty<0||ty>=WH)return T.DEEP_WATER;
  return tiles[ty*WW+tx];
}
function carvePath(x1,y1,x2,y2){
  let x=x1,y=y1;
  while(x!==x2||y!==y2){
    const t=tiles[y*WW+x];
    if(TWALK[t]&&t!==T.FOREST&&t!==T.SHALLOW_WATER&&t!==T.DEEP_WATER)
      tiles[y*WW+x]=T.PATH;
    if(x<x2)x++; else if(x>x2)x--;
    if(y<y2)y++; else if(y>y2)y--;
  }
}
function carveRoads(){
  for(let i=0;i<CENTRES.length-1;i++)
    carvePath(CENTRES[i][0],CENTRES[i][1],CENTRES[i+1][0],CENTRES[i+1][1]);
}
function placeDocks(seed){
  let s=seed^0x33333;
  function rnd(n){s=((s*1664525+1013904223)>>>0); return (s>>>16)%n;}
  const DIRS4=[[0,1],[0,-1],[1,0],[-1,0]];
  const DIRIDX=[0,1,3,2];
  for(const vc of CENTRES){
    let placed=0;
    for(let attempt=0;attempt<60&&placed<2;attempt++){
      const tx=vc[0]+rnd(24)-12, ty=vc[1]+rnd(24)-12;
      if(tx<3||tx>=WW-3||ty<3||ty>=WH-3)continue;
      const base=tiles[ty*WW+tx];
      if(base!==T.SAND&&base!==T.GRASS&&base!==T.DARK_GRASS)continue;
      for(let di=0;di<4;di++){
        const [ddx,ddy]=DIRS4[di];
        if((tx+ddx)<0||(tx+ddx)>=WW||(ty+ddy)<0||(ty+ddy)>=WH)continue;
        const adj=tiles[(ty+ddy)*WW+(tx+ddx)];
        if(adj!==T.SHALLOW_WATER)continue;
        const t2x=tx+ddx*2, t2y=ty+ddy*2;
        if(t2x<0||t2x>=WW||t2y<0||t2y>=WH)continue;
        const t2=tiles[t2y*WW+t2x];
        if(t2!==T.SHALLOW_WATER&&t2!==T.DEEP_WATER)continue;
        const len=2+rnd(2);
        let ok=true;
        for(let i=1;i<=len;i++){
          const dtx=tx+ddx*i,dty=ty+ddy*i;
          if(dtx<1||dtx>=WW-1||dty<1||dty>=WH-1){ok=false;break;}
          const dt=tiles[dty*WW+dtx];
          if(dt!==T.SHALLOW_WATER&&dt!==T.DEEP_WATER){ok=false;break;}
        }
        if(!ok)continue;
        for(let i=1;i<=len;i++)
          tiles[(ty+ddy*i)*WW+(tx+ddx*i)]=T.DOCK;
        docks.push({x:(tx+ddx*len)*TILE+TILE/2, y:(ty+ddy*len)*TILE+TILE/2, dir:DIRIDX[di]});
        placed++; break;
      }
    }
  }
}

// ── Minimap ────────────────────────────────────────────────────────────────
const MM_W=160, MM_H=120;
const mmCanvas=document.createElement('canvas');
mmCanvas.width=MM_W; mmCanvas.height=MM_H;
const mmCtx=mmCanvas.getContext('2d');
function buildMinimap(){
  const id=mmCtx.createImageData(MM_W,MM_H);
  const d=id.data;
  for(let y=0;y<WH;y++){
    for(let x=0;x<WW;x++){
      const t=worldTerrain(x,y);
      const hex=TCOLOR[t];
      const r=parseInt(hex.slice(1,3),16);
      const g=parseInt(hex.slice(3,5),16);
      const bv=parseInt(hex.slice(5,7),16);
      const i=(y*MM_W+x)*4;
      d[i]=r; d[i+1]=g; d[i+2]=bv; d[i+3]=255;
    }
  }
  for(const b of buildings){
    for(let by=b.y;by<b.y+b.h;by++)
      for(let bx=b.x;bx<b.x+b.w;bx++){
        const i=(by*MM_W+bx)*4;
        d[i]=180; d[i+1]=150; d[i+2]=100; d[i+3]=255;
      }
  }
  mmCtx.putImageData(id,0,0);
}

// ── Item rarity ────────────────────────────────────────────────────────────
const RARITIES=[
  {name:'Common',   color:'#aaaaaa', weight:55, mult:1.0},
  {name:'Uncommon', color:'#44dd55', weight:25, mult:1.3},
  {name:'Epic',     color:'#cc55ff', weight:12, mult:1.6},
  {name:'Legendary',color:'#ffaa22', weight:6,  mult:2.0},
  {name:'Mythic',   color:'#ff2255', weight:2,  mult:2.8},
];
function rollRarity(){
  let r=Math.random()*100;
  for(const rar of RARITIES){r-=rar.weight; if(r<=0)return rar;}
  return RARITIES[0];
}
function makeItem(kind,x,y,bob){
  const rar=rollRarity();
  const base=ITEM_DEF[kind];
  return {
    kind,x,y,collected:false,
    bob:bob!==undefined?bob:Math.random()*6.28,
    rarity:rar.name,rarColor:rar.color,
    atk:base.atk?Math.round(base.atk*rar.mult):0,
    def:base.def?Math.round(base.def*rar.mult):0,
    hp:base.hp?Math.round(base.hp*rar.mult):0,
  };
}

// Title screen button bounds (set in drawTitle)
let playBtnE={x:0,y:0,w:0,h:0}, playBtnA={x:0,y:0,w:0,h:0};
function inBtn(mx,my,b){return mx>=b.x&&mx<=b.x+b.w&&my>=b.y&&my<=b.y+b.h;}
canvas.addEventListener('click',e=>{
  const rect=canvas.getBoundingClientRect();
  const mx=e.clientX-rect.left, my=e.clientY-rect.top;
  if(gameState==='title'){
    if(inBtn(mx,my,playBtnE)) beginNewGame('endless');
    else if(inBtn(mx,my,playBtnA)) beginNewGame('adventure');
  } else if(gameState==='playing'&&gameOver){
    const cx=HALF_CW, cy=HALF_CH+100;
    if(Math.abs(mx-cx)<100&&Math.abs(my-cy)<20) beginNewGame(gameMode);
  } else if(gameState==='levelcomplete'){
    advanceLevel();
  } else if(gameState==='victory'){
    gameState='title';
  }
});
canvas.addEventListener('mousemove',e=>{
  const rect=canvas.getBoundingClientRect();
  const mx=e.clientX-rect.left, my=e.clientY-rect.top;
  if(gameState==='title'){
    const over=inBtn(mx,my,playBtnE)||inBtn(mx,my,playBtnA);
    canvas.style.cursor=over?'pointer':'default';
  } else { canvas.style.cursor='default'; }
});

function onKey(code){
  if(gameState==='title'){
    if(code==='Enter'||code==='Space') beginNewGame('endless');
    if(code==='KeyA') beginNewGame('adventure');
    return;
  }
  if(gameState==='levelcomplete'){if(code==='Enter'||code==='Space')advanceLevel(); return;}
  if(gameState==='victory'){if(code==='Enter'||code==='Space'||code==='KeyR')gameState='title'; return;}
  if(gameState!=='playing')return;
  if(gameOver){if(code==='KeyR')beginNewGame(gameMode); return;}
  if(code==='KeyF')playerAttack();
  if(code==='KeyE')talkNearby();
  for(let i=0;i<8;i++)if(code===`Digit${i+1}`)player.equip=player.inv[i]?i:-1;
}

// ── Start a new game ───────────────────────────────────────────────────────
function beginNewGame(mode='endless'){
  gameMode=mode;
  adventureLevel=1;
  levelKills=0;
  gameState='generating';
  genProgress=0;
  genFrames=0;
  worldSeed=Math.random()*99999|0;
}
function advanceLevel(){
  adventureLevel++;
  levelKills=0;
  gameState='generating';
  genProgress=0;
  genFrames=0;
  worldSeed=Math.random()*99999|0;
}

function doGenerate(){
  // reset world data
  tiles=new Uint8Array(WW*WH);
  buildings=[]; docks=[];
  enemies=[]; npcs=[]; items=[]; projs=[]; floats=[]; particles=[];

  CENTRES=makeCentres(worldSeed);
  generateWorld(worldSeed);
  placeBuildings(worldSeed);
  carveRoads();
  placeDocks(worldSeed);
  buildMinimap();
  spawnNPCs(worldSeed);
  spawnInitialEnemies(worldSeed);
  spawnInitialItems(worldSeed);

  // find a valid spawn tile near the centre
  const vc=CENTRES[CENTRES.length>>1];
  player.x=vc[0]*TILE+TILE/2;
  player.y=vc[1]*TILE+TILE/2;
  // nudge until walkable
  for(let r=0;r<20;r++){
    if(walkable(player.x,player.y)&&!isWading(player.x,player.y))break;
    player.x+=TILE; player.y+=TILE;
  }
  // adventure mode: scale enemies per level (only reset player on level 1)
  if(gameMode!=='adventure'||adventureLevel===1){
    player.hp=100; player.maxHp=100; player.atk=10; player.def=0;
    player.xp=0; player.level=1;
    player.inv.fill(null); player.invCount=0; player.equip=-1;
  } else {
    player.hp=Math.min(player.hp,player.maxHp); // carry HP into next level
  }
  player.dead=false;
  player.atkCd=0; player.atkMaxCd=0.35; player.iFrames=0; player.wading=false;
  // adventure: scale enemy stats with level; endless uses base stats
  if(gameMode==='adventure'){
    const scale=1+0.25*(adventureLevel-1);
    for(const e of enemies){
      const d=ENEMY_DEF[e.kind];
      e.hp=Math.round(d.hp*scale); e.maxHp=e.hp;
    }
    levelTarget=8+adventureLevel*4;   // kills needed: 12, 16, 20 … 48
  } else {
    levelTarget=0;
  }
  levelKills=0;
  waterTime=0; spawnTimer=5; gameOver=false;
  updateCamera();
  gameState='playing';
}

// ── Walkable ───────────────────────────────────────────────────────────────
function walkable(px,py){
  const R=10;
  const pts=[[px-R,py-R],[px+R,py-R],[px-R,py+R],[px+R,py+R]];
  for(const [cx,cy] of pts){
    const tx=Math.floor(cx/TILE), ty=Math.floor(cy/TILE);
    if(!TWALK[worldGet(tx,ty)])return false;
  }
  return true;
}
function isWading(px,py){
  return worldGet(Math.floor(px/TILE),Math.floor(py/TILE))===T.SHALLOW_WATER;
}

// ── Spawn functions ────────────────────────────────────────────────────────
// Non-fisherman, non-ally jobs for random village spawning
const VILLAGE_JOBS=NPC_JOBS.filter(j=>j!=='Fisherman'&&j!=='Ally');

function makeNPC(x,y,job,name,seed,extra={}){
  return {x,y,tx:x,ty:y,job,name,
    speech:'',speechTimer:0,idleTimer:2+Math.random()*3,
    moving:false,dir:0,frame:0,frameT:0,speed:45,
    seed,fisherman:false,msgCount:0,
    ally:false,following:false,hp:80,maxHp:80,atkTimer:0,dead:false,
    ...extra};
}

function spawnNPCs(seed){
  let s=seed^0xabcde;
  function rnd(n){s=((s*1664525+1013904223)>>>0); return (s>>>16)%n;}

  for(const vc of CENTRES){
    const count=3+rnd(3);
    for(let k=0;k<count;k++){
      // try multiple positions to avoid building interiors
      let placed=false;
      for(let attempt=0;attempt<20&&!placed;attempt++){
        const tx=vc[0]+rnd(14)-7, ty=vc[1]+rnd(14)-7;
        if(tx<1||tx>=WW-1||ty<1||ty>=WH-1)continue;
        const t=worldGet(tx,ty); // use worldGet to detect building tiles
        if(!TWALK[t]||t===T.SHALLOW_WATER||t===T.WALL||t===T.FLOOR||t===T.DOOR)continue;
        const job=VILLAGE_JOBS[rnd(VILLAGE_JOBS.length)];
        npcs.push(makeNPC(tx*TILE+TILE/2,ty*TILE+TILE/2,job,
          NPC_NAMES[rnd(NPC_NAMES.length)],rnd(10000),{speed:40+rnd(20),idleTimer:2+rnd(3)}));
        placed=true;
      }
    }
    // spawn one ally per village
    for(let attempt=0;attempt<30;attempt++){
      const tx=vc[0]+rnd(16)-8, ty=vc[1]+rnd(16)-8;
      if(tx<1||tx>=WW-1||ty<1||ty>=WH-1)continue;
      const t=worldGet(tx,ty);
      if(!TWALK[t]||t===T.SHALLOW_WATER||t===T.WALL||t===T.FLOOR||t===T.DOOR)continue;
      npcs.push(makeNPC(tx*TILE+TILE/2,ty*TILE+TILE/2,'Ally',
        NPC_NAMES[rnd(NPC_NAMES.length)],rnd(10000),
        {ally:true,speed:120,idleTimer:999}));
      break;
    }
  }

  // fishermen on docks
  let fs=seed^0xf1234;
  function frnd(n){fs=((fs*1664525+1013904223)>>>0); return (fs>>>16)%n;}
  for(const dock of docks){
    npcs.push({...makeNPC(dock.x,dock.y,'Fisherman',NPC_NAMES[frnd(NPC_NAMES.length)],frnd(10000)),
      fisherman:true,dir:dock.dir,speed:0,idleTimer:999,
      fishT:Math.random()*Math.PI*2,catchTimer:3+Math.random()*5});
  }
}
function spawnInitialEnemies(seed){
  let s=seed^0x99991;
  function rnd(n){s=((s*1664525+1013904223)>>>0); return (s>>>16)%n;}
  for(let i=0;i<40;i++){
    const tx=rnd(WW), ty=rnd(WH);
    const t=worldTerrain(tx,ty);
    if(!TWALK[t]||t===T.FOREST||t===T.SHALLOW_WATER)continue;
    const kind=ENEMY_KINDS[rnd(ENEMY_KINDS.length)];
    const d=ENEMY_DEF[kind];
    enemies.push({kind,x:tx*TILE+TILE/2,y:ty*TILE+TILE/2,hp:d.hp,maxHp:d.hp,dead:false,
      dir:0,frame:0,frameT:0,moving:false,atkTimer:0,hitFlash:0});
  }
}
function spawnInitialItems(seed){
  let s=seed^0x54321;
  function rnd(n){s=((s*1664525+1013904223)>>>0); return (s>>>16)%n;}
  for(let i=0;i<60;i++){
    const tx=rnd(WW), ty=rnd(WH);
    const t=worldTerrain(tx,ty);
    if(!TWALK[t]||t===T.FOREST||t===T.SHALLOW_WATER)continue;
    items.push(makeItem(ITEM_KINDS[rnd(ITEM_KINDS.length)],tx*TILE+TILE/2,ty*TILE+TILE/2,rnd(628)/100));
  }
}

// ── Water particles ────────────────────────────────────────────────────────
function spawnSplash(x,y,count=4){
  for(let i=0;i<count;i++){
    const ang=Math.random()*Math.PI*2;
    const spd=20+Math.random()*40;
    particles.push({x,y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd-30,life:0.5+Math.random()*0.3,r:2+Math.random()*2});
  }
}

// ── Talk / attack ──────────────────────────────────────────────────────────
function talkNearby(){
  for(const n of npcs){
    if(n.dead)continue;
    const dx=n.x-player.x, dy=n.y-player.y;
    if(dx*dx+dy*dy<(2.5*TILE)**2){
      if(n.ally&&!n.following){
        // recruit ally
        n.following=true;
        n.speech='With you till the end!';
        n.speechTimer=2.5;
      } else {
        n.speech=genDialogue(n);
        n.msgCount=(n.msgCount||0)+1;
        n.speechTimer=4.0;
      }
      return;
    }
  }
}
function playerAttack(){
  if(player.atkCd>0||player.dead)return;
  const item=player.equip>=0?player.inv[player.equip]:null;
  const idef=item?ITEM_DEF[item.kind]:null;
  const cat=idef?idef.cat:'MELEE';
  const isRanged=cat==='RANGED';
  const atkDmg=player.atk+(item?item.atk||0:0);

  // per-weapon cooldown
  const cd=item&&item.kind==='Crossbow'?1.6:
            isRanged?0.45:
            idef&&idef.range?0.5:0.32;
  player.atkCd=cd; player.atkMaxCd=cd;

  if(isRanged){
    const dirs=[[0,-1],[0,1],[-1,0],[1,0]];
    const [vx,vy]=dirs[player.dir];
    const spd=item.kind==='Crossbow'?420:300;
    projs.push({x:player.x,y:player.y,vx:vx*spd,vy:vy*spd,fromPlayer:true,damage:atkDmg,life:1.8,dead:false});
  } else {
    const range=(idef&&idef.range?idef.range:2.2)*TILE;
    for(const e of enemies){
      if(e.dead)continue;
      const dx=e.x-player.x, dy=e.y-player.y;
      if(dx*dx+dy*dy<range*range) damageEnemy(e,atkDmg);
    }
  }
}
function damageEnemy(e,dmg){
  e.hp-=dmg; e.hitFlash=0.2;
  floats.push({text:'-'+dmg,x:e.x,y:e.y-20,color:'#ff4444',life:1.0});
  if(e.hp<=0){
    e.dead=true;
    const xp=ENEMY_DEF[e.kind].xp;
    player.xp+=xp;
    floats.push({text:'+'+xp+' XP',x:e.x,y:e.y-36,color:'#ffdd00',life:1.2});
    checkLevelUp();
    if(Math.random()<0.3)
      items.push(makeItem(ITEM_KINDS[Math.random()*ITEM_KINDS.length|0],e.x,e.y));
    if(gameMode==='adventure'){
      levelKills++;
      if(levelKills>=levelTarget){
        if(adventureLevel>=10) gameState='victory';
        else { gameState='levelcomplete'; levelCompleteTimer=0; }
      }
    }
  }
}
function checkLevelUp(){
  const needed=player.level*100;
  if(player.xp>=needed){
    player.xp-=needed; player.level++;
    player.atk+=4; player.def+=2; player.maxHp+=10;
    player.hp=Math.min(player.hp+20,player.maxHp);
    floats.push({text:'LEVEL UP!',x:player.x,y:player.y-60,color:'#ffffaa',life:2.0});
  }
}

// ── Update ─────────────────────────────────────────────────────────────────
let lastTime=0;
function update(ts){
  const dt=Math.min((ts-lastTime)/1000,0.05);
  lastTime=ts;

  if(gameState==='title'){
    titleTime+=dt;
    drawTitle();
    requestAnimationFrame(update);
    return;
  }
  if(gameState==='generating'){
    genFrames++;
    drawGenerating();
    if(genFrames>=3) doGenerate();
    requestAnimationFrame(update);
    return;
  }
  if(gameState==='levelcomplete'){
    levelCompleteTimer+=dt;
    render();
    drawLevelComplete();
    requestAnimationFrame(update);
    return;
  }
  if(gameState==='victory'){
    render();
    drawVictory();
    requestAnimationFrame(update);
    return;
  }

  // ── playing ──
  waterTime+=dt;

  if(!player.dead&&!gameOver){
    let dx=0,dy=0;
    if(keys['ArrowLeft']||keys['KeyA']){dx=-1; player.dir=2;}
    if(keys['ArrowRight']||keys['KeyD']){dx=1; player.dir=3;}
    if(keys['ArrowUp']||keys['KeyW']){dy=-1; player.dir=1;}
    if(keys['ArrowDown']||keys['KeyS']){dy=1; player.dir=0;}
    const wading=isWading(player.x,player.y);
    player.wading=wading;
    const speed=wading?52:130;
    if(dx!==0&&dy!==0){const s=1/Math.SQRT2; dx*=s; dy*=s;}
    player.moving=(dx!==0||dy!==0);
    if(player.moving){
      const nx=player.x+dx*speed*dt;
      if(walkable(nx,player.y))player.x=nx;
      const ny=player.y+dy*speed*dt;
      if(walkable(player.x,ny))player.y=ny;
      player.frameT+=dt;
      if(player.frameT>0.15){player.frame=(player.frame+1)%4; player.frameT=0;}
      if(wading){player.splashTimer-=dt; if(player.splashTimer<=0){player.splashTimer=0.18; spawnSplash(player.x,player.y+8,3);}}
    } else {
      player.frame=0;
      if(wading&&Math.random()<dt*3) spawnSplash(player.x,player.y+8,1);
    }
    player.atkCd=Math.max(0,player.atkCd-dt);
    player.iFrames=Math.max(0,player.iFrames-dt);
  }

  for(const e of enemies){
    if(e.dead)continue;
    const d=ENEMY_DEF[e.kind];
    const dx=player.x-e.x, dy=player.y-e.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<200){
      if(d.ranged&&dist<d.range&&dist>TILE*2){
        e.moving=false; e.atkTimer-=dt;
        if(e.atkTimer<=0){e.atkTimer=2; projs.push({x:e.x,y:e.y,vx:(dx/dist)*200,vy:(dy/dist)*200,fromPlayer:false,damage:d.dmg,life:2,dead:false});}
      } else {
        e.moving=true;
        const nx=e.x+(dx/dist)*d.spd*TILE*dt, ny=e.y+(dy/dist)*d.spd*TILE*dt;
        if(walkable(nx,e.y))e.x=nx;
        if(walkable(e.x,ny))e.y=ny;
        if(Math.abs(dx)>Math.abs(dy)) e.dir=dx>0?3:2; else e.dir=dy>0?0:1;
        e.frameT+=dt; if(e.frameT>0.2){e.frame=(e.frame+1)%4; e.frameT=0;}
        if(dist<TILE*1.2){
          e.atkTimer-=dt;
          if(e.atkTimer<=0){e.atkTimer=1;
            if(player.iFrames<=0){
              const dmg=Math.max(1,d.dmg-player.def);
              player.hp-=dmg; player.iFrames=0.5;
              floats.push({text:'-'+dmg,x:player.x,y:player.y-30,color:'#ff8888',life:0.8});
              if(player.hp<=0){player.hp=0; player.dead=true; gameOver=true;}
            }}
        }
      }
    } else e.moving=false;
    e.hitFlash=Math.max(0,e.hitFlash-dt);
  }
  for(const p of projs){
    if(p.dead)continue;
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt;
    if(p.life<=0){p.dead=true; continue;}
    if(!TWALK[worldGet(Math.floor(p.x/TILE),Math.floor(p.y/TILE))]){p.dead=true; continue;}
    if(p.fromPlayer){
      for(const e of enemies){
        if(e.dead)continue;
        const dx=e.x-p.x, dy=e.y-p.y;
        if(dx*dx+dy*dy<(ENEMY_DEF[e.kind].size+4)**2){damageEnemy(e,p.damage); p.dead=true; break;}
      }
    } else {
      const dx=player.x-p.x, dy=player.y-p.y;
      if(dx*dx+dy*dy<196&&player.iFrames<=0){
        const dmg=Math.max(1,p.damage-player.def);
        player.hp-=dmg; player.iFrames=0.5; p.dead=true;
        floats.push({text:'-'+dmg,x:player.x,y:player.y-30,color:'#ff8888',life:0.8});
        if(player.hp<=0){player.hp=0; player.dead=true; gameOver=true;}
      }
    }
  }
  for(const it of items){
    if(it.collected)continue;
    it.bob+=dt*2;
    const dx=it.x-player.x, dy=it.y-player.y;
    if(dx*dx+dy*dy<(TILE*0.9)**2){
      const d=ITEM_DEF[it.kind];
      if(d.cat==='FOOD'){player.hp=Math.min(player.maxHp,player.hp+it.hp); floats.push({text:'+'+it.hp+' HP',x:player.x,y:player.y-40,color:'#55ff88',life:1}); it.collected=true;}
      else if(player.invCount<8){player.inv[player.invCount++]=it; floats.push({text:it.rarity+' '+it.kind,x:player.x,y:player.y-40,color:it.rarColor,life:1.4}); it.collected=true;}
    }
  }
  for(const n of npcs){
    if(n.dead)continue;
    n.speechTimer=Math.max(0,n.speechTimer-dt);
    if(n.speechTimer<=0)n.speech='';

    // ── fisherman ────────────────────────────────────────────────────────────
    if(n.fisherman){
      n.fishT+=dt*0.8; n.catchTimer-=dt;
      if(n.catchTimer<=0){
        n.catchTimer=4+Math.random()*6;
        n.speech='Got one!'; n.speechTimer=1.8;
        const RDIR=[[0,1],[0,-1],[-1,0],[1,0]];
        const [rdx,rdy]=RDIR[n.dir];
        spawnSplash(n.x+rdx*40,n.y+rdy*40+8,6);
      }
      continue;
    }

    // ── ally combat AI ────────────────────────────────────────────────────────
    if(n.ally&&n.following){
      // find nearest enemy
      let target=null, bestDist=Infinity;
      for(const e of enemies){
        if(e.dead)continue;
        const dx=e.x-n.x, dy=e.y-n.y, d2=dx*dx+dy*dy;
        if(d2<(180)**2&&d2<bestDist){bestDist=d2; target=e;}
      }
      if(target){
        const dx=target.x-n.x, dy=target.y-n.y, dist=Math.sqrt(dx*dx+dy*dy);
        if(dist>TILE*1.1){
          const nx=n.x+(dx/dist)*n.speed*dt, ny=n.y+(dy/dist)*n.speed*dt;
          if(walkable(nx,n.y)&&!isWading(nx,n.y))n.x=nx;
          if(walkable(n.x,ny)&&!isWading(n.x,ny))n.y=ny;
          if(Math.abs(dx)>Math.abs(dy)) n.dir=dx>0?3:2; else n.dir=dy>0?0:1;
          n.frameT+=dt; if(n.frameT>0.15){n.frame=(n.frame+1)%4; n.frameT=0;}
        }
        n.atkTimer-=dt;
        if(dist<TILE*1.4&&n.atkTimer<=0){
          n.atkTimer=0.7;
          target.hp-=18; target.hitFlash=0.2;
          floats.push({text:'-18',x:target.x,y:target.y-20,color:'#ffaa44',life:0.8});
          if(target.hp<=0){
            target.dead=true;
            player.xp+=ENEMY_DEF[target.kind].xp;
            checkLevelUp();
          }
        }
      } else {
        // follow player if no enemy nearby
        const pdx=player.x-n.x, pdy=player.y-n.y, pdist=Math.sqrt(pdx*pdx+pdy*pdy);
        if(pdist>TILE*2.5){
          const nx=n.x+(pdx/pdist)*n.speed*dt, ny=n.y+(pdy/pdist)*n.speed*dt;
          if(walkable(nx,n.y)&&!isWading(nx,n.y))n.x=nx;
          if(walkable(n.x,ny)&&!isWading(n.x,ny))n.y=ny;
          if(Math.abs(pdx)>Math.abs(pdy)) n.dir=pdx>0?3:2; else n.dir=pdy>0?0:1;
          n.frameT+=dt; if(n.frameT>0.15){n.frame=(n.frame+1)%4; n.frameT=0;}
        }
      }
      n.hitFlash=Math.max(0,(n.hitFlash||0)-dt);
      continue;
    }

    // ── unrecruited ally — idle, show recruit hint ────────────────────────────
    if(n.ally&&!n.following){
      const pdx=player.x-n.x, pdy=player.y-n.y;
      if(pdx*pdx+pdy*pdy<(3*TILE)**2&&n.speechTimer<=0){
        n.speech='Press E to recruit me!'; n.speechTimer=2.0;
      }
      continue;
    }

    // ── regular NPC wander ────────────────────────────────────────────────────
    if(n.moving){
      const dx=n.tx-n.x, dy=n.ty-n.y;
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<4){n.moving=false; n.idleTimer=2+Math.random()*3;}
      else{
        const nx=n.x+(dx/dist)*n.speed*dt, ny=n.y+(dy/dist)*n.speed*dt;
        if(walkable(nx,n.y)&&!isWading(nx,n.y))n.x=nx;
        if(walkable(n.x,ny)&&!isWading(n.x,ny))n.y=ny;
        if(Math.abs(dx)>Math.abs(dy)) n.dir=dx>0?3:2; else n.dir=dy>0?0:1;
        n.frameT+=dt; if(n.frameT>0.2){n.frame=(n.frame+1)%4; n.frameT=0;}
      }
    } else {
      n.idleTimer-=dt;
      if(n.idleTimer<=0){
        n.moving=true;
        const ang=Math.random()*Math.PI*2, dist=2+Math.random()*3;
        n.tx=n.x+Math.cos(ang)*dist*TILE; n.ty=n.y+Math.sin(ang)*dist*TILE;
      }
    }
  }
  for(const p of particles){p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=120*dt; p.life-=dt;}
  for(const f of floats){f.y-=40*dt; f.life-=dt;}
  spawnTimer-=dt; if(spawnTimer<=0){spawnTimer=8; trySpawnEnemy();}
  updateCamera();
  render();
  requestAnimationFrame(update);
}

function trySpawnEnemy(){
  const px=player.x/TILE|0, py=player.y/TILE|0;
  for(let a=0;a<20;a++){
    const ang=Math.random()*Math.PI*2, dist=15+Math.random()*10;
    const tx=(px+Math.cos(ang)*dist)|0, ty=(py+Math.sin(ang)*dist)|0;
    if(tx<0||tx>=WW||ty<0||ty>=WH)continue;
    const t=worldTerrain(tx,ty);
    if(!TWALK[t]||t===T.FOREST||t===T.SHALLOW_WATER)continue;
    const kind=ENEMY_KINDS[Math.random()*ENEMY_KINDS.length|0];
    const d=ENEMY_DEF[kind];
    enemies.push({kind,x:tx*TILE+TILE/2,y:ty*TILE+TILE/2,hp:d.hp,maxHp:d.hp,dead:false,dir:0,frame:0,frameT:0,moving:false,atkTimer:0,hitFlash:0});
    return;
  }
}
function updateCamera(){
  camX=Math.max(0,Math.min(WW*TILE-CW, player.x-HALF_CW));
  camY=Math.max(0,Math.min(WH*TILE-CH, player.y-HALF_CH));
}

// ── Title screen ───────────────────────────────────────────────────────────
let titleBg=null;
// floating orbs for title ambiance
const titleOrbs=Array.from({length:18},(_,i)=>({
  x:hash(i,0,1)*CW, y:hash(i,0,2)*CH,
  vx:(hash(i,0,5)-0.5)*12, vy:(hash(i,0,6)-0.5)*10,
  r:18+hash(i,0,3)*28,
  color:`hsl(${180+hash(i,0,4)*80|0},70%,55%)`,
  phase:hash(i,0,7)*Math.PI*2
}));

function buildTitleBg(){
  const c=document.createElement('canvas'); c.width=CW; c.height=CH;
  const cx=c.getContext('2d');
  const g=cx.createLinearGradient(0,0,0,CH);
  g.addColorStop(0,'#060d1f'); g.addColorStop(0.5,'#0c2040'); g.addColorStop(1,'#0a1830');
  cx.fillStyle=g; cx.fillRect(0,0,CW,CH);
  // stars — two layers (tiny + slightly bigger)
  for(let i=0;i<200;i++){
    const sx=hash(i,0,1)*CW, sy=hash(i,0,2)*CH;
    const sr=hash(i,0,3)<0.8?0.6:1.4;
    cx.fillStyle=`rgba(255,255,255,${0.3+hash(i,0,4)*0.7})`;
    cx.beginPath(); cx.arc(sx,sy,sr,0,Math.PI*2); cx.fill();
  }
  return c;
}

function titleKey(label,x,y){
  const kw=label.length<=2?28:label.length*8+12, kh=22;
  ctx.fillStyle='rgba(255,255,255,0.12)';
  ctx.beginPath(); ctx.roundRect(x-kw/2,y-kh+4,kw,kh,5); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.roundRect(x-kw/2,y-kh+4,kw,kh,5); ctx.stroke();
  ctx.fillStyle='#e8f4ff'; ctx.font='bold 11px monospace'; ctx.textAlign='center';
  ctx.fillText(label,x,y);
}

function drawTitle(){
  if(!titleBg) titleBg=buildTitleBg();
  ctx.drawImage(titleBg,0,0);

  // animated drifting glow orbs
  for(const o of titleOrbs){
    o.x+=o.vx*0.016; o.y+=o.vy*0.016;
    if(o.x<-o.r)o.x=CW+o.r; if(o.x>CW+o.r)o.x=-o.r;
    if(o.y<-o.r)o.y=CH+o.r; if(o.y>CH+o.r)o.y=-o.r;
    const alpha=0.04+Math.sin(titleTime*0.6+o.phase)*0.02;
    ctx.save();
    const rg=ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r);
    rg.addColorStop(0,o.color.replace('55%','55%').replace('hsl','hsla').replace(')',`,${alpha+0.05})`));
    rg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(o.x,o.y,o.r,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // twinkling stars
  for(let i=0;i<200;i++){
    const sx=hash(i,0,1)*CW, sy=hash(i,0,2)*CH;
    const twinkle=0.4+Math.sin(titleTime*2.5+hash(i,0,8)*10)*0.3;
    ctx.globalAlpha=(0.3+hash(i,0,4)*0.7)*twinkle;
    ctx.fillStyle='#ffffff';
    const sr=hash(i,0,3)<0.8?0.6:1.4;
    ctx.beginPath(); ctx.arc(sx,sy,sr,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;

  // mountains silhouette (back layer)
  ctx.fillStyle='#0d2010';
  ctx.beginPath(); ctx.moveTo(0,CH);
  for(let x=0;x<=CW;x+=6){
    const y=CH*0.52+Math.sin(x*0.012)*22+Math.sin(x*0.035+1)*12+Math.sin(x*0.007)*30;
    ctx.lineTo(x,y);
  }
  ctx.lineTo(CW,CH); ctx.closePath(); ctx.fill();

  // mountains front layer
  ctx.fillStyle='#152a10';
  ctx.beginPath(); ctx.moveTo(0,CH);
  for(let x=0;x<=CW;x+=6){
    const y=CH*0.60+Math.sin(x*0.018+0.5)*16+Math.sin(x*0.05+2)*9+Math.sin(x*0.01+1)*18;
    ctx.lineTo(x,y);
  }
  ctx.lineTo(CW,CH); ctx.closePath(); ctx.fill();

  // animated water
  for(let x=0;x<CW;x+=2){
    const h=CH*0.72+Math.sin(titleTime*1.1+x*0.035)*7+Math.sin(titleTime*0.65+x*0.065)*4;
    ctx.fillStyle='rgba(18,80,130,0.85)'; ctx.fillRect(x,h,2,CH-h);
  }
  ctx.fillStyle='rgba(40,120,180,0.3)';
  for(let x=0;x<CW;x+=2){
    const h=CH*0.72+Math.sin(titleTime*1.7+x*0.045+1)*5+Math.sin(titleTime*0.85+x*0.08)*3;
    ctx.fillRect(x,h,2,CH-h);
  }
  // water shimmer streaks
  for(let i=0;i<12;i++){
    const wx=(hash(i,0,9)*CW+titleTime*20)%CW;
    const wy=CH*0.74+hash(i,0,10)*(CH*0.24);
    ctx.fillStyle=`rgba(120,200,255,${0.04+Math.sin(titleTime*2+i)*0.03})`;
    ctx.fillRect(wx,wy,30+hash(i,0,11)*50,2);
  }

  // foreground grass strip
  ctx.fillStyle='#1a3c14';
  ctx.beginPath(); ctx.moveTo(0,CH);
  for(let x=0;x<=CW;x+=4){
    const y=CH*0.78+Math.sin(x*0.04+titleTime*0.3)*4+Math.sin(x*0.015)*8;
    ctx.lineTo(x,y);
  }
  ctx.lineTo(CW,CH); ctx.closePath(); ctx.fill();

  // ── TITLE TEXT ──────────────────────────────────────────────────────────────
  ctx.textAlign='center';
  // glow halo
  const pulse=Math.sin(titleTime*1.8)*6;
  ctx.save();
  ctx.shadowColor='#ffcc00'; ctx.shadowBlur=30+pulse;
  ctx.font='bold 66px monospace'; ctx.fillStyle='rgba(0,0,0,0)';
  ctx.fillText('TOP-DOWN WORLD',HALF_CW,158);
  ctx.restore();
  // drop shadow
  ctx.font='bold 66px monospace';
  ctx.fillStyle='rgba(0,0,0,0.7)';
  ctx.fillText('TOP-DOWN WORLD',HALF_CW+4,162);
  // gradient fill
  const tg=ctx.createLinearGradient(0,100,0,170);
  tg.addColorStop(0,'#fff5aa'); tg.addColorStop(0.45,'#ffcc22'); tg.addColorStop(1,'#e07800');
  ctx.fillStyle=tg;
  ctx.fillText('TOP-DOWN WORLD',HALF_CW,158);
  // highlight edge
  ctx.strokeStyle='rgba(255,240,120,0.25)'; ctx.lineWidth=1;
  ctx.strokeText('TOP-DOWN WORLD',HALF_CW,158);

  // subtitle
  ctx.font='italic 15px monospace';
  ctx.fillStyle='rgba(160,220,255,0.8)';
  ctx.fillText('✦  Explore a procedurally generated world  ✦',HALF_CW,188);

  // separator line
  const lineY=204;
  const lg=ctx.createLinearGradient(HALF_CW-220,0,HALF_CW+220,0);
  lg.addColorStop(0,'rgba(255,200,50,0)'); lg.addColorStop(0.5,'rgba(255,200,50,0.6)'); lg.addColorStop(1,'rgba(255,200,50,0)');
  ctx.strokeStyle=lg; ctx.lineWidth=1;

  ctx.shadowColor='#55ff88'; ctx.shadowBlur=10+pulse; ctx.strokeStyle='rgba(120,255,160,0.75)'; ctx.lineWidth=1.5;

  ctx.font='10px monospace'; ctx.fillStyle='rgba(160,255,200,0.7)'; ctx.fillText('Survive forever',btnX0+btnW/2,btnY+46);
  ctx.font='9px monospace'; ctx.fillStyle='rgba(140,200,160,0.5)'; ctx.fillText('ENTER or click',btnX0+btnW/2,btnY+btnH+14);

  // Adventure button
  const btnX1=btnX0+btnW+btnGap;
  playBtnA={x:btnX1,y:btnY,w:btnW,h:btnH};
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.beginPath(); ctx.roundRect(btnX1+3,btnY+5,btnW,btnH,12); ctx.fill();
  const bg2=ctx.createLinearGradient(btnX1,btnY,btnX1,btnY+btnH);
  bg2.addColorStop(0,`hsl(38,${75+pulseBg*100|0}%,48%)`); bg2.addColorStop(1,`hsl(28,${65+pulseBg*100|0}%,28%)`);
  ctx.fillStyle=bg2; ctx.beginPath(); ctx.roundRect(btnX1,btnY,btnW,btnH,12); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.14)'; ctx.beginPath(); ctx.roundRect(btnX1+2,btnY+2,btnW-4,btnH/2-2,10); ctx.fill();
  ctx.shadowColor='#ffaa33'; ctx.shadowBlur=10+pulse; ctx.strokeStyle='rgba(255,190,80,0.75)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.roundRect(btnX1,btnY,btnW,btnH,12); ctx.stroke(); ctx.shadowBlur=0;
  ctx.font='bold 19px monospace'; ctx.fillStyle='#fff'; ctx.fillText('⚔  ADVENTURE',btnX1+btnW/2,btnY+28);
  ctx.font='10px monospace'; ctx.fillStyle='rgba(255,220,140,0.8)'; ctx.fillText('10 Worlds to conquer',btnX1+btnW/2,btnY+46);
  ctx.font='9px monospace'; ctx.fillStyle='rgba(200,160,100,0.5)'; ctx.fillText('A key or click',btnX1+btnW/2,btnY+btnH+14);

  // ── CONTROLS PANEL ──────────────────────────────────────────────────────────
  const panX=HALF_CW-310, panY=302, panW=620, panH=198;
  // panel backdrop
  ctx.fillStyle='rgba(0,8,24,0.72)';
  ctx.beginPath(); ctx.roundRect(panX,panY,panW,panH,12); ctx.fill();
  ctx.strokeStyle='rgba(80,140,220,0.35)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.roundRect(panX,panY,panW,panH,12); ctx.stroke();
  // panel header
  const hg=ctx.createLinearGradient(panX,panY,panX+panW,panY);
  hg.addColorStop(0,'rgba(30,80,180,0)'); hg.addColorStop(0.5,'rgba(30,80,180,0.5)'); hg.addColorStop(1,'rgba(30,80,180,0)');
  ctx.fillStyle=hg; ctx.fillRect(panX,panY,panW,28);
  ctx.font='bold 12px monospace'; ctx.fillStyle='#88ccff'; ctx.textAlign='center';
  ctx.fillText('— CONTROLS —',HALF_CW,panY+18);

  // key helper: draws a key badge + label
  function krow(keys2,label,x,y){
    let kx=x;
    for(const k of keys2){
      const kw=k.length<=2?26:k.length*7+12;
      ctx.fillStyle='rgba(255,255,255,0.10)';
      ctx.beginPath(); ctx.roundRect(kx,y-15,kw,20,4); ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.30)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.roundRect(kx,y-15,kw,20,4); ctx.stroke();
      ctx.fillStyle='#ddeeff'; ctx.font='bold 10px monospace'; ctx.textAlign='center';
      ctx.fillText(k,kx+kw/2,y);
      kx+=kw+4;
    }
    ctx.fillStyle='#7a9ab8'; ctx.font='11px monospace'; ctx.textAlign='left';
    ctx.fillText(label,kx+6,y);
  }

  // left column
  const col1=panX+24, col2=panX+panW/2+16, row1=panY+52, rowGap=30;
  krow(['W','A','S','D'],'Move',col1,row1);
  krow(['↑','←','↓','→'],'Also move',col1,row1+rowGap);
  krow(['F'],'Attack / Shoot',col1,row1+rowGap*2);
  krow(['E'],'Talk / Recruit ally',col1,row1+rowGap*3);
  krow(['1','-','8'],'Equip item slot',col1,row1+rowGap*4);

  // right column — tips
  const tipY=panY+50;
  ctx.font='bold 11px monospace'; ctx.fillStyle='#ffdd88'; ctx.textAlign='left';
  ctx.fillText('Tips',col2,tipY);
  ctx.strokeStyle='rgba(255,220,100,0.3)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(col2,tipY+3); ctx.lineTo(col2+120,tipY+3); ctx.stroke();
  const tips=[
    '🌊 Shallow water slows you',
    '⚔  Adventure: 10 worlds to beat',
    '⚔  Find allies in villages',
    '💜 Higher rarity = stronger stats',
    '⭐ Defeat enemies to level up',
  ];
  ctx.font='11px monospace'; ctx.fillStyle='#9ab8cc';
  for(let i=0;i<tips.length;i++) ctx.fillText(tips[i],col2,tipY+22+i*26);

  // rarity legend strip
  const legY=panY+panH-22;
  ctx.font='10px monospace'; ctx.fillStyle='rgba(120,160,200,0.6)'; ctx.textAlign='center';
  ctx.fillText('Item Rarities:',HALF_CW-160,legY);
  const rarNames=[['Common','#aaaaaa'],['Uncommon','#44dd55'],['Epic','#cc55ff'],['Legendary','#ffaa22'],['Mythic','#ff2255']];
  let rx=HALF_CW-60;
  for(const [rn,rc] of rarNames){
    ctx.fillStyle=rc; ctx.font='bold 10px monospace'; ctx.textAlign='left';
    ctx.shadowColor=rc; ctx.shadowBlur=5;
    ctx.fillText(rn,rx,legY);
    ctx.shadowBlur=0;
    rx+=rn.length*7+10;
  }

  ctx.textAlign='left';
}

// ── Generation screen ──────────────────────────────────────────────────────
function drawGenerating(){
  ctx.fillStyle='#0a1020';
  ctx.fillRect(0,0,CW,CH);

  // spinning dots
  ctx.textAlign='center';
  ctx.font='bold 28px monospace';
  ctx.fillStyle='#88ccff';
  ctx.fillText('Generating World…',HALF_CW,HALF_CH-40);

  // progress bar placeholder (just animated)
  const barW=300, barH=12;
  const barX=HALF_CW-barW/2, barY=HALF_CH;
  ctx.fillStyle='rgba(255,255,255,0.1)';
  ctx.beginPath(); ctx.roundRect(barX,barY,barW,barH,6); ctx.fill();
  const prog=(genFrames/3)*barW;
  const bg=ctx.createLinearGradient(barX,0,barX+barW,0);
  bg.addColorStop(0,'#2266cc'); bg.addColorStop(1,'#44ddff');
  ctx.fillStyle=bg;
  ctx.beginPath(); ctx.roundRect(barX,barY,prog,barH,6); ctx.fill();

  ctx.font='13px monospace'; ctx.fillStyle='rgba(160,200,255,0.7)';
  ctx.fillText('Loading terrain…',HALF_CW,HALF_CH+40);
  ctx.textAlign='left';
}

// ── Render (playing) ───────────────────────────────────────────────────────
function render(){
  ctx.clearRect(0,0,CW,CH);
  drawWorld();
  const drawables=[];
  for(const e of enemies) if(!e.dead&&onScreen(e.x,e.y)) drawables.push({y:e.y,draw:()=>drawEnemy(e)});
  for(const n of npcs)    if(onScreen(n.x,n.y))           drawables.push({y:n.y,draw:()=>drawNPC(n)});
  drawables.push({y:player.y,draw:drawPlayer});
  drawables.sort((a,b)=>a.y-b.y);
  for(const d of drawables) d.draw();
  drawItems();
  drawProjectiles();
  drawParticles();
  drawFloats();
  drawHUD();
  drawInventoryBar();
  drawMinimap();
  drawVignette();
  if(gameOver) drawGameOver();
}

function onScreen(wx,wy){
  const sx=wx-camX, sy=wy-camY;
  return sx>-64&&sx<CW+64&&sy>-64&&sy<CH+64;
}

function drawWorld(){
  const tx0=Math.floor(camX/TILE), ty0=Math.floor(camY/TILE);
  const tx1=Math.ceil((camX+CW)/TILE), ty1=Math.ceil((camY+CH)/TILE);
  for(let ty=ty0;ty<=ty1;ty++)
    for(let tx=tx0;tx<=tx1;tx++)
      drawTile(worldGet(tx,ty),tx,ty,(tx*TILE-camX)|0,(ty*TILE-camY)|0);
  for(const b of buildings){
    const bsx=(b.x+b.w/2)*TILE-camX, bsy=(b.y-1)*TILE-camY;
    if(bsx<-60||bsx>CW+60||bsy<-20||bsy>CH+20)continue;
    ctx.fillStyle='rgba(0,0,0,0.6)';
    ctx.font='bold 10px monospace';
    const tw=ctx.measureText(b.type).width;
    ctx.fillRect(bsx-tw/2-3,bsy-11,tw+6,14);
    ctx.fillStyle='#ffeeaa'; ctx.fillText(b.type,bsx-tw/2,bsy);
  }
}

function drawTile(t,tx,ty,px,py){
  if(t===T.DEEP_WATER||t===T.SHALLOW_WATER){
    const phase=Math.sin(waterTime*1.5+(tx+ty)*0.4)*0.06;
    const bright=t===T.DEEP_WATER?0.9+phase:1+phase;
    const base=t===T.DEEP_WATER?'#1a6b9a':'#2e8fc0';
    const r=Math.min(255,parseInt(base.slice(1,3),16)*bright|0);
    const g=Math.min(255,parseInt(base.slice(3,5),16)*bright|0);
    const bv=Math.min(255,parseInt(base.slice(5,7),16)*bright|0);
    ctx.fillStyle=`rgb(${r},${g},${bv})`; ctx.fillRect(px,py,TILE,TILE);
    if(hash(tx,ty,8)<0.3){
      const rph=Math.sin(waterTime*2+(tx*1.3+ty*0.7))*2;
      ctx.strokeStyle='rgba(255,255,255,0.18)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.ellipse(px+8+hash(tx,ty,9)*16,py+TILE/2+rph,6,2,0,0,Math.PI*2); ctx.stroke();
    }
    return;
  }
  ctx.fillStyle=TCOLOR[t]; ctx.fillRect(px,py,TILE,TILE);

  if(t===T.BRIDGE){
    ctx.fillStyle='#2e8fc0'; ctx.fillRect(px,py,TILE,TILE);
    const horiz=(worldTerrain(tx-1,ty)===T.BRIDGE||worldTerrain(tx+1,ty)===T.BRIDGE||
                 worldTerrain(tx-1,ty)===T.PATH||worldTerrain(tx+1,ty)===T.PATH);
    ctx.fillStyle='#8B6914';
    if(horiz){ctx.fillRect(px,py+4,TILE,6); ctx.fillRect(px,py+13,TILE,5); ctx.fillRect(px,py+22,TILE,6);}
    else{ctx.fillRect(px+4,py,6,TILE); ctx.fillRect(px+13,py,5,TILE); ctx.fillRect(px+22,py,6,TILE);}
    ctx.strokeStyle='#5c3c00'; ctx.lineWidth=2;
    if(horiz){ctx.beginPath();ctx.moveTo(px,py+2);ctx.lineTo(px+TILE,py+2);ctx.stroke(); ctx.beginPath();ctx.moveTo(px,py+TILE-2);ctx.lineTo(px+TILE,py+TILE-2);ctx.stroke();}
    else{ctx.beginPath();ctx.moveTo(px+2,py);ctx.lineTo(px+2,py+TILE);ctx.stroke(); ctx.beginPath();ctx.moveTo(px+TILE-2,py);ctx.lineTo(px+TILE-2,py+TILE);ctx.stroke();}
    return;
  }
  if(t===T.DOCK){
    ctx.fillStyle='#2e8fc0'; ctx.fillRect(px,py,TILE,TILE);
    ctx.fillStyle='#7a5a20'; ctx.fillRect(px+1,py+1,TILE-2,TILE-2);
    ctx.strokeStyle='#5c4010'; ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(px+1,py+TILE/3);ctx.lineTo(px+TILE-1,py+TILE/3);ctx.stroke();
    ctx.beginPath();ctx.moveTo(px+1,py+TILE*2/3);ctx.lineTo(px+TILE-1,py+TILE*2/3);ctx.stroke();
    ctx.beginPath();ctx.moveTo(px+TILE/3,py+1);ctx.lineTo(px+TILE/3,py+TILE-1);ctx.stroke();
    ctx.beginPath();ctx.moveTo(px+TILE*2/3,py+1);ctx.lineTo(px+TILE*2/3,py+TILE-1);ctx.stroke();
    return;
  }
  if(t===T.GRASS&&hash(tx,ty,1)<0.2){
    ctx.fillStyle='#4a8a2a';
    ctx.fillRect(px+4,py+8,2,6);ctx.fillRect(px+9,py+6,2,8);ctx.fillRect(px+14,py+9,2,5);ctx.fillRect(px+20,py+7,2,7);
  } else if(t===T.DARK_GRASS&&hash(tx,ty,2)<0.3){
    ctx.fillStyle='#2d601a'; ctx.fillRect(px+6,py+5,3,9); ctx.fillRect(px+16,py+7,3,7);
  } else if(t===T.FOREST){
    ctx.fillStyle='#0d3a0a'; ctx.beginPath();ctx.arc(px+TILE/2,py+TILE/2,11,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#1a5c14'; ctx.beginPath();ctx.arc(px+TILE/2,py+TILE/2,8,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#2a7a20'; ctx.beginPath();ctx.arc(px+TILE/2-3,py+TILE/2-3,5,0,Math.PI*2);ctx.fill();
  } else if(t===T.MOUNTAIN){
    ctx.fillStyle='#6a6a6a'; ctx.beginPath();ctx.moveTo(px+TILE/2,py+4);ctx.lineTo(px+4,py+TILE-4);ctx.lineTo(px+TILE-4,py+TILE-4);ctx.closePath();ctx.fill();
    ctx.fillStyle='#aaaaaa'; ctx.beginPath();ctx.moveTo(px+TILE/2,py+4);ctx.lineTo(px+TILE/2-5,py+14);ctx.lineTo(px+TILE/2+5,py+14);ctx.closePath();ctx.fill();
  } else if(t===T.SNOW){
    ctx.fillStyle='#ccccdd'; ctx.beginPath();ctx.moveTo(px+TILE/2,py+2);ctx.lineTo(px+5,py+16);ctx.lineTo(px+TILE-5,py+16);ctx.closePath();ctx.fill();
    ctx.fillStyle='#ffffff'; ctx.beginPath();ctx.moveTo(px+TILE/2,py+2);ctx.lineTo(px+TILE/2-4,py+10);ctx.lineTo(px+TILE/2+4,py+10);ctx.closePath();ctx.fill();
  } else if(t===T.WALL){
    ctx.strokeStyle='#3a2a1a'; ctx.lineWidth=1; ctx.strokeRect(px+1,py+1,TILE-2,TILE-2);
    ctx.fillStyle='#4a3830'; ctx.fillRect(px+2,py+2,TILE/2-2,TILE/2-2); ctx.fillRect(px+TILE/2+1,py+TILE/2+1,TILE/2-3,TILE/2-3);
  } else if(t===T.FLOOR){
    ctx.strokeStyle='#8a6040'; ctx.lineWidth=0.5;
    ctx.beginPath();ctx.moveTo(px+TILE/2,py);ctx.lineTo(px+TILE/2,py+TILE);ctx.stroke();
    ctx.beginPath();ctx.moveTo(px,py+TILE/2);ctx.lineTo(px+TILE,py+TILE/2);ctx.stroke();
  } else if(t===T.DOOR){
    ctx.fillStyle='#6a3820'; ctx.fillRect(px+6,py+4,TILE-12,TILE-4);
    ctx.fillStyle='#aa6640'; ctx.fillRect(px+8,py+6,TILE-16,TILE-8);
    ctx.fillStyle='#ffdd88'; ctx.beginPath();ctx.arc(px+TILE-10,py+TILE/2,2,0,Math.PI*2);ctx.fill();
  } else if(t===T.PATH){
    ctx.fillStyle='#7a6345'; ctx.fillRect(px+2,py+2,TILE-4,TILE-4);
    if(hash(tx,ty,3)<0.3){ctx.fillStyle='#9a8055'; ctx.fillRect(px+4+hash(tx,ty,4)*10|0,py+6,4,4);}
  } else if(t===T.SAND&&hash(tx,ty,5)<0.15){
    ctx.fillStyle='#c2a47c'; ctx.beginPath();ctx.arc(px+8+hash(tx,ty,6)*16|0,py+8+hash(tx,ty,7)*16|0,2,0,Math.PI*2);ctx.fill();
  }
}

function drawEnemy(e){
  const d=ENEMY_DEF[e.kind];
  const sx=e.x-camX|0, sy=e.y-camY|0;
  const bob=e.moving?Math.sin(e.frameT*8)*2:0;
  const fl=e.hitFlash>0;
  const sc=d.size/12; // scale: 1.0 at size 12

  // shadow
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.beginPath();ctx.ellipse(sx,sy+d.size,d.size*0.7,d.size*0.28,0,0,Math.PI*2);ctx.fill();

  if(e.kind==='Slime'){
    const wob=Math.sin(e.frameT*5)*0.14;
    ctx.fillStyle=fl?'#ffffff':d.color;
    ctx.shadowColor=d.color; ctx.shadowBlur=10;
    ctx.beginPath();ctx.ellipse(sx,sy-d.size*0.5+bob,d.size*(1+wob),d.size*(0.8-wob),0,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,255,255,0.35)';
    ctx.beginPath();ctx.ellipse(sx-d.size*0.25,sy-d.size*0.75+bob,d.size*0.28,d.size*0.18,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=fl?'#fff':'#111';
    ctx.beginPath();ctx.arc(sx-d.size*0.3,sy-d.size*0.52+bob,1.8,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(sx+d.size*0.3,sy-d.size*0.52+bob,1.8,0,Math.PI*2);ctx.fill();
  } else {
    // humanoid
    const bw=Math.round(10*sc), bh=Math.round(14*sc), hs=Math.round(9*sc);
    const wside=e.dir===2?-1:1;
    const wx=sx+wside*(bw/2+2)|0, wy=sy-Math.round(12*sc)+bob|0;

    const bodyCol=fl?'#ffffff':d.color;
    const skinCol=fl?'#ffffff':{
      Orc:'#7ab830',Skeleton:'#d8d4c0',Archer:'#c47f2e',
      Mage:'#c080f0',Troll:'#8a9960'
    }[e.kind]||'#c89060';

    // ── WEAPON ──
    if(e.kind==='Archer'){
      ctx.strokeStyle=fl?'#fff':'#7a4e1e'; ctx.lineWidth=Math.max(1.5,2*sc);
      ctx.beginPath();ctx.arc(wx,wy,Math.round(9*sc),-0.85,0.85,wside<0);ctx.stroke();
      ctx.strokeStyle='rgba(210,200,160,0.8)'; ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(wx+wside*Math.round(9*sc)*-0.9,wy-Math.round(7*sc));
      ctx.lineTo(wx+wside*Math.round(9*sc)*-0.9,wy+Math.round(7*sc));ctx.stroke();
    } else if(e.kind==='Mage'){
      const slen=Math.round(22*sc);
      ctx.strokeStyle=fl?'#fff':'#6622aa'; ctx.lineWidth=Math.max(1.5,2*sc);
      ctx.shadowColor='#aa44ee'; ctx.shadowBlur=8;
      ctx.beginPath();ctx.moveTo(wx,wy+Math.round(8*sc));ctx.lineTo(wx,wy-slen);ctx.stroke();
      ctx.shadowBlur=0;
      ctx.fillStyle=fl?'#fff':'#dd88ff'; ctx.shadowColor='#ee88ff'; ctx.shadowBlur=10;
      ctx.beginPath();ctx.arc(wx,wy-slen,Math.round(4*sc),0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
    } else if(e.kind==='Troll'){
      const cw=Math.round(7*sc), ch=Math.round(20*sc);
      ctx.fillStyle=fl?'#fff':'#6a4010';
      ctx.fillRect(wx-Math.round(3*sc),wy-ch/2,cw,ch);
      ctx.fillRect(wx-Math.round(5*sc),wy-ch/2,cw+4,Math.round(7*sc));
    } else {
      // SWORD (Orc, Skeleton, generic)
      const slen=Math.round(18*sc);
      const swcol=e.kind==='Skeleton'?'#d8d4c0':'#aaaacc';
      ctx.fillStyle=fl?'#fff':'#442200';
      ctx.fillRect(wx-Math.round(sc),wy+Math.round(3*sc),Math.round(3*sc),Math.round(7*sc));
      ctx.fillStyle=fl?'#fff':'#7a5010';
      ctx.fillRect(wx-Math.round(4*sc),wy+Math.round(1*sc),Math.round(9*sc),Math.round(3*sc));
      ctx.fillStyle=fl?'#fff':swcol;
      ctx.shadowColor=swcol; ctx.shadowBlur=fl?0:5;
      ctx.fillRect(wx-Math.round(sc),wy-slen+Math.round(1*sc),Math.round(3*sc),slen);
      ctx.beginPath();ctx.moveTo(wx-Math.round(sc),wy-slen);ctx.lineTo(wx+Math.round(2*sc),wy-slen);
      ctx.lineTo(wx+Math.round(0.5*sc),wy-slen-Math.round(7*sc));ctx.closePath();ctx.fill();
      ctx.shadowBlur=0;
    }

    // ── BODY ──
    ctx.fillStyle=bodyCol;
    ctx.fillRect(sx-bw/2|0,sy-Math.round(16*sc)+bob|0,bw,bh);
    ctx.strokeStyle='rgba(0,0,0,0.35)'; ctx.lineWidth=1;
    ctx.strokeRect(sx-bw/2|0,sy-Math.round(16*sc)+bob|0,bw,bh);
    if(e.kind==='Skeleton'){
      ctx.strokeStyle='rgba(0,0,0,0.25)'; ctx.lineWidth=0.5;
      for(let i=1;i<=3;i++){
        const ry=(sy-Math.round(16*sc)+bob+i*Math.round(3.5*sc))|0;
        ctx.beginPath();ctx.moveTo(sx-bw/2|0,ry);ctx.lineTo(sx+bw/2|0,ry);ctx.stroke();
      }
    }

    // ── HEAD ──
    ctx.fillStyle=skinCol;
    ctx.fillRect(sx-hs/2|0,(sy-Math.round((16+hs)*sc)+bob)|0,hs,hs);
    ctx.strokeStyle='rgba(0,0,0,0.35)'; ctx.lineWidth=1;
    ctx.strokeRect(sx-hs/2|0,(sy-Math.round((16+hs)*sc)+bob)|0,hs,hs);

    // glowing red eyes
    const eo=e.dir===2?-2:(e.dir===3?2:0);
    const ey2=(sy-Math.round((16+hs-3)*sc)+bob)|0;
    ctx.fillStyle=fl?'#fff':'#ee2200';
    ctx.shadowColor='#ff4400'; ctx.shadowBlur=fl?0:6;
    ctx.fillRect((sx-3+eo)|0,ey2,Math.round(2*sc),Math.round(2*sc));
    ctx.fillRect((sx+1+eo)|0,ey2,Math.round(2*sc),Math.round(2*sc));
    ctx.shadowBlur=0;
  }

  // HP bar
  const bw2=d.size*3, bh2=4, bx2=sx-bw2/2, by2=sy-d.size*2-10;
  ctx.fillStyle='#330000';ctx.fillRect(bx2,by2,bw2,bh2);
  const hpFrac=e.hp/e.maxHp;
  ctx.fillStyle=hpFrac>0.5?'#ee2222':'#ff6600';
  ctx.fillRect(bx2,by2,bw2*hpFrac,bh2);
  ctx.strokeStyle='rgba(0,0,0,0.5)';ctx.lineWidth=0.5;ctx.strokeRect(bx2,by2,bw2,bh2);
  ctx.font='9px monospace'; ctx.fillStyle='rgba(255,160,160,0.9)'; ctx.textAlign='center';
  ctx.fillText(e.kind,sx,by2-2); ctx.textAlign='left';
}

function drawNPC(n){
  const sx=n.x-camX|0, sy=n.y-camY|0;
  const bob=n.moving?Math.sin(n.frameT*8)*2:0;
  ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.beginPath();ctx.ellipse(sx,sy+10,9,4,0,0,Math.PI*2);ctx.fill();
  const colors={Villager:'#4488cc',Merchant:'#cc8822',Guard:'#445566',Elder:'#886644',Wanderer:'#668844',Fisherman:'#557799',Farmer:'#88aa33',Baker:'#ddaa55',Healer:'#55aa88',Bard:'#aa44aa',Knight:'#778899',Ranger:'#557744',Scholar:'#6655aa',Innkeeper:'#aa6633',Ally:'#ddaa00'};
  ctx.fillStyle=colors[n.job]||'#4488cc'; ctx.fillRect(sx-7,sy-16+bob,14,18);
  ctx.fillStyle='#f5d5a0'; ctx.beginPath();ctx.arc(sx,sy-20+bob,8,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.3)'; ctx.lineWidth=1; ctx.stroke();
  ctx.fillStyle='#333';
  ctx.beginPath();ctx.arc(sx-3,sy-20+bob,1.5,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(sx+3,sy-20+bob,1.5,0,Math.PI*2);ctx.fill();
  if(n.fisherman){
    ctx.fillStyle='#d4a017'; ctx.fillRect(sx-10,sy-28+bob,20,4);
    ctx.beginPath();ctx.ellipse(sx,sy-32+bob,7,3,0,0,Math.PI*2);ctx.fill();
    const RDIR=[[0,1],[0,-1],[-1,0],[1,0]];
    const [rdx,rdy]=RDIR[n.dir];
    const rodLen=28;
    ctx.strokeStyle='#6b3a1f'; ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(sx+rdx*6,sy-14+bob);ctx.lineTo(sx+rdx*rodLen,sy-14+bob+rdy*rodLen);ctx.stroke();
    const lx=sx+rdx*rodLen+rdx*8, ly=sy-14+bob+rdy*rodLen+rdy*8+10;

    const fy=ly+Math.sin(n.fishT)*3;
    ctx.fillStyle='#ff3333'; ctx.beginPath();ctx.arc(lx,fy,3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffffff'; ctx.beginPath();ctx.arc(lx,fy,1.5,0,Math.PI*2);ctx.fill();
  }
  ctx.textAlign='center'; ctx.font='10px monospace'; ctx.fillStyle='#ffffcc';
  ctx.fillText(n.name,sx,sy-32+bob);
  ctx.fillStyle=n.fisherman?'#88ddff':'#aaaaff';
  ctx.fillText('['+n.job[0]+']',sx,sy-23+bob); ctx.textAlign='left';
  if(n.speech&&n.speechTimer>0){
    const lines=wrapText(n.speech,18);
    const bh2=lines.length*14+10, bw2=140;

    ctx.fillStyle='#fff'; ctx.font='11px monospace'; ctx.textAlign='center';
    for(let i=0;i<lines.length;i++) ctx.fillText(lines[i],sx,by2+16+i*14);
    ctx.textAlign='left';

}

function drawPlayer(){
  if(player.dead)return;
  const sx=player.x-camX|0, sy=player.y-camY|0;
  const bob=player.moving?Math.sin(player.frameT*8)*2:0;
  if(player.iFrames>0&&Math.sin(player.iFrames*40)>0)return;

  const item=player.equip>=0?player.inv[player.equip]:null;
  const idef=item?ITEM_DEF[item.kind]:null;
  const cat=idef?idef.cat:'MELEE';
  const isRanged=cat==='RANGED';
  const atkProg=player.atkMaxCd>0?(1-player.atkCd/player.atkMaxCd):1;
  const swinging=player.atkCd>0&&!isRanged;

  // facing direction vector [down,up,left,right]
  const DVEC=[[0,1],[0,-1],[-1,0],[1,0]];
  const [dvx,dvy]=DVEC[player.dir];
  const facingAng=Math.atan2(dvy,dvx);

  // hand offset [down,up,left,right]
  const HOFF=[[10,-8],[10,-20],[-13,-12],[13,-12]];
  const [hox,hoy]=HOFF[player.dir];
  const whx=sx+hox, why=sy+hoy+bob;

  // ── big swing trail arc — drawn BEFORE the body so it looks like it passes through ──
  if(swinging&&item){
    const bladeLen=(idef.range?idef.range*8:24)+10;
    const SWING=1.9; // total arc width in radians
    const swingStart=facingAng-SWING/2;
    const swingNow=swingStart+atkProg*SWING;
    const trailCol=item.rarColor||idef.color||'#ffdd44';
    const cx=sx, cy=sy-8+bob;

    ctx.save();
    // filled arc sector — trail
    ctx.shadowColor=trailCol; ctx.shadowBlur=18;
    ctx.globalAlpha=0.38*(1-atkProg*0.5);
    ctx.fillStyle=trailCol;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,bladeLen,swingStart,swingNow);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur=0;

    // inner lighter core of trail
    ctx.globalAlpha=0.18*(1-atkProg*0.4);
    ctx.fillStyle='#ffffff';
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,bladeLen*0.55,swingStart,swingNow);
    ctx.closePath();
    ctx.fill();

    // bright leading-edge arc line
    ctx.globalAlpha=0.9*(1-atkProg*0.6);
    ctx.strokeStyle='#ffffff';
    ctx.lineWidth=3;
    ctx.shadowColor=trailCol; ctx.shadowBlur=20;
    ctx.beginPath();
    ctx.arc(cx,cy,bladeLen,swingNow-0.06,swingNow);
    ctx.stroke();
    ctx.shadowBlur=0;
    ctx.restore();
  }

  // ── weapon draw (held weapon — blade + bow) ───────────────────────────────
  const drawWeapon=()=>{
    if(!item)return;
    if(!isRanged){
      const bladeLen=idef.range?idef.range*8:24;
      const sweepAng=swinging?(atkProg*1.9-0.95):0;
      const rot=facingAng+Math.PI/2+sweepAng;
      ctx.save(); ctx.translate(whx,why); ctx.rotate(rot);
      // pommel / handle
      ctx.fillStyle='#553311'; ctx.fillRect(-2,4,4,9);
      // guard
      ctx.fillStyle='#886622'; ctx.fillRect(-5,0,10,5);
      // blade
      const bladeCol=item.rarColor||idef.color||'#aaaacc';
      ctx.shadowColor=bladeCol; ctx.shadowBlur=swinging?14:5;
      ctx.fillStyle=bladeCol;
      ctx.fillRect(-2.5,-bladeLen,5,bladeLen);
      // highlight stripe on blade
      ctx.fillStyle='rgba(255,255,255,0.45)';
      ctx.fillRect(-0.5,-bladeLen,1.5,bladeLen);
      // tip
      ctx.fillStyle=bladeCol;
      ctx.beginPath();ctx.moveTo(-2.5,-bladeLen);ctx.lineTo(2.5,-bladeLen);ctx.lineTo(0,-bladeLen-9);ctx.closePath();ctx.fill();
      ctx.shadowBlur=0;
      ctx.restore();
    } else {
      const isCrossbow=item.kind==='Crossbow';
      ctx.save(); ctx.translate(whx,why); ctx.rotate(facingAng+Math.PI/2);
      ctx.fillStyle='#775533'; ctx.fillRect(-3,0,6,isCrossbow?12:9);
      ctx.fillStyle=isCrossbow?'#445566':'#887744';
      ctx.fillRect(-2,-18,4,18);
      if(isCrossbow){
        ctx.fillStyle='#664422'; ctx.fillRect(-10,-12,20,3);
        ctx.strokeStyle='rgba(220,220,180,0.8)'; ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(-10,-10);ctx.lineTo(0,-14);ctx.lineTo(10,-10);ctx.stroke();
      } else {
        ctx.strokeStyle='#886633'; ctx.lineWidth=2.5;
        ctx.beginPath();ctx.arc(0,-8,10,-0.9,0.9);ctx.stroke();
        ctx.strokeStyle='rgba(220,220,180,0.7)'; ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(-9,-1);ctx.lineTo(0,-5);ctx.lineTo(9,-1);ctx.stroke();
      }
      ctx.restore();
      // muzzle flash
      if(player.atkCd>0&&atkProg<0.12){
        ctx.save(); ctx.shadowColor='#ffff44'; ctx.shadowBlur=16;
        ctx.fillStyle='rgba(255,230,80,0.95)';
        ctx.beginPath();ctx.arc(whx+dvx*20,why+dvy*20,7,0,Math.PI*2);ctx.fill();
        ctx.shadowBlur=0; ctx.restore();
      }
    }
  };

  // shadow
  ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.beginPath();ctx.ellipse(sx,sy+10,11,4,0,0,Math.PI*2);ctx.fill();
  if(player.wading){ctx.fillStyle='rgba(46,143,192,0.5)'; ctx.fillRect(sx-11,sy+2,22,10);}

  if(player.dir===1) drawWeapon(); // weapon behind when facing up

  // body
  ctx.fillStyle='#3366cc'; ctx.fillRect(sx-8,sy-16+bob,16,18);
  ctx.strokeStyle='#1133aa'; ctx.lineWidth=1.5; ctx.strokeRect(sx-8,sy-16+bob,16,18);
  // head
  ctx.fillStyle='#f5d5a0'; ctx.fillRect(sx-9,sy-30+bob,18,18);
  ctx.strokeStyle='#cc9966'; ctx.lineWidth=1.5; ctx.strokeRect(sx-9,sy-30+bob,18,18);
  const ex=player.dir===2?-3:(player.dir===3?3:0);
  const ey=player.dir===1?-1:(player.dir===0?1:0);
  ctx.fillStyle='#222';
  ctx.fillRect(sx-6+ex,sy-25+bob+ey,4,4); ctx.fillRect(sx+2+ex,sy-25+bob+ey,4,4);
  ctx.fillStyle='#994433'; ctx.fillRect(sx-4+ex,sy-19+bob+ey,8,2);
  ctx.fillStyle='#cc8855'; ctx.fillRect(sx-1+ex,sy-22+bob+ey,2,2);

  if(player.dir!==1) drawWeapon(); // weapon in front for other dirs

  // crossbow reload bar
  if(item&&item.kind==='Crossbow'&&player.atkCd>0){
    const prog=1-player.atkCd/player.atkMaxCd;
    ctx.fillStyle='rgba(0,0,0,0.65)'; ctx.fillRect(sx-18,sy-44+bob,36,6);
    ctx.fillStyle='#ffaa22'; ctx.fillRect(sx-18,sy-44+bob,36*prog,6);
    ctx.strokeStyle='#cc7700'; ctx.lineWidth=1; ctx.strokeRect(sx-18,sy-44+bob,36,6);
    ctx.font='8px monospace'; ctx.fillStyle='#ffdd88'; ctx.textAlign='center';
    ctx.fillText('RELOAD',sx,sy-46+bob); ctx.textAlign='left';
  }

  if(player.wading){ctx.font='9px monospace';ctx.fillStyle='#88ddff';ctx.textAlign='center';ctx.fillText('wading',sx,sy-46+bob);ctx.textAlign='left';}
}

function drawParticles(){
  for(const p of particles){
    if(p.life<=0)continue;
    ctx.globalAlpha=Math.min(1,p.life/0.3)*0.8;
    ctx.fillStyle='#aaddff';
    ctx.beginPath();ctx.arc(p.x-camX,p.y-camY,p.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawItems(){
  for(const it of items){
    if(it.collected||!onScreen(it.x,it.y))continue;
    const sx=it.x-camX|0, sy=it.y-camY|0, bob=Math.sin(it.bob)*4;
    const d=ITEM_DEF[it.kind];
    const glowColor=it.rarColor||d.color;
    const glowBlur=it.rarity==='Mythic'?22:it.rarity==='Legendary'?16:it.rarity==='Epic'?12:8;
    ctx.shadowColor=glowColor; ctx.shadowBlur=glowBlur;
    ctx.fillStyle=glowColor; ctx.beginPath();ctx.arc(sx,sy+bob,8,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    ctx.font='12px serif'; ctx.textAlign='center'; ctx.fillText(d.icon,sx,sy+4+bob);
    ctx.font='8px monospace'; ctx.fillStyle=glowColor; ctx.fillText(it.rarity,sx,sy-20+bob);
    ctx.fillStyle='#fff'; ctx.fillText(it.kind,sx,sy-11+bob); ctx.textAlign='left';
  }
}

function drawProjectiles(){
  for(const p of projs){
    if(p.dead)continue;
    ctx.fillStyle=p.fromPlayer?'#ffff44':'#ff4444';
    ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=8;
    ctx.beginPath();ctx.arc(p.x-camX|0,p.y-camY|0,4,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
  }
}

function drawFloats(){
  for(const f of floats){
    if(f.life<=0)continue;
    ctx.globalAlpha=Math.min(1,f.life);
    ctx.font='bold 14px monospace'; ctx.fillStyle=f.color;
    ctx.strokeStyle='rgba(0,0,0,0.8)'; ctx.lineWidth=3;
    ctx.strokeText(f.text,f.x-camX,f.y-camY); ctx.fillText(f.text,f.x-camX,f.y-camY);
  }
  ctx.globalAlpha=1;
}

  ctx.fillStyle='#ff4444'; ctx.fillRect(11,11,Math.min(152,player.hp/player.maxHp*152),8);

  ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(10,32,154,10);
  const xpN=player.level*100;
  ctx.fillStyle='#2244cc'; ctx.fillRect(11,33,(player.xp/xpN)*152,8);
  ctx.strokeStyle='#888'; ctx.lineWidth=1; ctx.strokeRect(10,32,154,10);
  ctx.font='9px monospace'; ctx.fillStyle='#aac4ff'; ctx.fillText(`LV${player.level}  XP ${player.xp}/${xpN}`,14,41);
  const tx=player.x/TILE|0, ty=player.y/TILE|0;
  const zones={0:'Deep Sea',1:'Shallow Water',2:'Beach',3:'Grassland',4:'Meadow',5:'Forest',6:'Mountains',7:'Snowfields',8:'Road',9:'Building',10:'Building',11:'Building',12:'Bridge',13:'Dock'};
  ctx.font='10px monospace'; ctx.fillStyle=player.wading?'#88ddff':'#ccc';
  ctx.fillText(`${zones[worldTerrain(tx,ty)]||'?'} (${tx},${ty})`,10,60);
  ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fillRect(10,CH-30,220,20);
  ctx.font='9px monospace'; ctx.fillStyle='#888';
  ctx.fillText('WASD:Move  F:Attack  E:Talk  1-8:Equip',14,CH-16);

  if(gameMode==='adventure'){
    // adventure progress bar (top-right, below minimap area)
    const px=CW-174, py=144, pw=164, ph=14;
    ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.beginPath(); ctx.roundRect(px-2,py-2,pw+4,ph+4,4); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.08)'; ctx.beginPath(); ctx.roundRect(px,py,pw,ph,3); ctx.fill();
    const frac=Math.min(1,levelKills/levelTarget);
    const barG=ctx.createLinearGradient(px,py,px+pw,py);
    barG.addColorStop(0,'#cc4400'); barG.addColorStop(1,'#ffaa22');
    ctx.fillStyle=barG; ctx.beginPath(); ctx.roundRect(px,py,pw*frac,ph,3); ctx.fill();
    ctx.strokeStyle='rgba(255,160,50,0.5)'; ctx.lineWidth=1; ctx.beginPath(); ctx.roundRect(px,py,pw,ph,3); ctx.stroke();
    ctx.font='bold 9px monospace'; ctx.fillStyle='#fff'; ctx.textAlign='center';
    ctx.fillText(`World ${adventureLevel}/10 — ${levelKills}/${levelTarget} kills`,px+pw/2,py+10);
    ctx.textAlign='left';
  }
}

function drawInventoryBar(){
  const slotW=40, slotH=40, gap=4, totalW=8*(slotW+gap)-gap;
  const startX=(CW-totalW)/2, startY=CH-slotH-10;
  ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(startX-4,startY-4,totalW+8,slotH+8);
  for(let i=0;i<8;i++){
    const x=startX+i*(slotW+gap), y=startY;
    ctx.fillStyle=player.equip===i?'rgba(255,220,50,0.3)':'rgba(255,255,255,0.08)'; ctx.fillRect(x,y,slotW,slotH);
    const it=player.inv[i];
    const rarBorder=it?(player.equip===i?it.rarColor:'#555'):player.equip===i?'#ffdd22':'#555';
    ctx.strokeStyle=rarBorder; ctx.lineWidth=player.equip===i?2:1; ctx.strokeRect(x,y,slotW,slotH);
    if(it&&it.rarity!=='Common'){
      ctx.shadowColor=it.rarColor; ctx.shadowBlur=8;
      ctx.strokeStyle=it.rarColor; ctx.lineWidth=1.5; ctx.strokeRect(x+1,y+1,slotW-2,slotH-2);
      ctx.shadowBlur=0;
    }
    ctx.font='9px monospace'; ctx.fillStyle='#888'; ctx.textAlign='center'; ctx.fillText(i+1,x+slotW/2,y+slotH-3); ctx.textAlign='left';
    if(it){
      const d=ITEM_DEF[it.kind];
      ctx.font='18px serif'; ctx.textAlign='center'; ctx.fillText(d.icon,x+slotW/2,y+24); ctx.textAlign='left';
      ctx.font='7px monospace'; ctx.fillStyle=it.rarColor||'#ddd'; ctx.textAlign='center'; ctx.fillText(it.rarity,x+slotW/2,y+10); ctx.textAlign='left';
    }
  }
}

// ── Level Complete screen ──────────────────────────────────────────────────
function drawLevelComplete(){
  const t=levelCompleteTimer;
  const alpha=Math.min(1,t*2);
  ctx.fillStyle=`rgba(0,0,0,${0.7*alpha})`; ctx.fillRect(0,0,CW,CH);
  ctx.textAlign='center';
  // big title
  ctx.save();
  ctx.shadowColor='#aaff88'; ctx.shadowBlur=30;
  ctx.font='bold 58px monospace';
  const grad=ctx.createLinearGradient(0,HALF_CH-90,0,HALF_CH-30);
  grad.addColorStop(0,'#ffffff'); grad.addColorStop(0.5,'#aaff88'); grad.addColorStop(1,'#55cc44');
  ctx.fillStyle=grad; ctx.globalAlpha=alpha;
  ctx.fillText('LEVEL COMPLETE!',HALF_CW,HALF_CH-50);
  ctx.restore();
  ctx.globalAlpha=alpha;
  // level badge
  ctx.font='bold 22px monospace'; ctx.fillStyle='#ffdd44';
  ctx.fillText(`World ${adventureLevel} of 10 cleared`,HALF_CW,HALF_CH);

  ctx.font='16px monospace'; ctx.fillStyle='#aaddff';
  ctx.fillText(`Kills: ${levelKills}   Level: ${player.level}   HP: ${player.hp}/${player.maxHp}`,HALF_CW,HALF_CH+36);
  // next level hint
  const pulse=Math.sin(t*4)*0.15+0.85;
  ctx.font='bold 18px monospace'; ctx.fillStyle=`rgba(255,220,80,${pulse*alpha})`;

    ctx.fillText(`▶  Enter World ${adventureLevel+1}  (ENTER / click)`,HALF_CW,HALF_CH+90);
    ctx.font='12px monospace'; ctx.fillStyle=`rgba(160,200,140,${0.7*alpha})`;
    ctx.fillText('Enemies grow stronger each world',HALF_CW,HALF_CH+116);

  ctx.globalAlpha=1; ctx.textAlign='left';
}

// ── Victory screen ─────────────────────────────────────────────────────────
function drawVictory(){
  ctx.fillStyle='rgba(0,0,0,0.8)'; ctx.fillRect(0,0,CW,CH);
  ctx.textAlign='center';
  // stars
  for(let i=0;i<80;i++){
    const sx=hash(i,5,1)*CW, sy=hash(i,5,2)*CH;
    const tw=0.4+Math.sin(titleTime*3+i)*0.4;
    ctx.globalAlpha=tw*0.8; ctx.fillStyle='#ffff88';
    ctx.beginPath(); ctx.arc(sx,sy,hash(i,5,3)<0.7?0.8:1.8,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
  // glow ring
  const rg=ctx.createRadialGradient(HALF_CW,HALF_CH-60,10,HALF_CW,HALF_CH-60,200);
  rg.addColorStop(0,'rgba(255,200,50,0.18)'); rg.addColorStop(1,'rgba(255,200,50,0)');
  ctx.fillStyle=rg; ctx.fillRect(0,0,CW,CH);
  // title
  ctx.save();
  ctx.shadowColor='#ffcc00'; ctx.shadowBlur=40;
  ctx.font='bold 62px monospace';
  const vg=ctx.createLinearGradient(0,HALF_CH-130,0,HALF_CH-60);
  vg.addColorStop(0,'#ffffff'); vg.addColorStop(0.4,'#ffe566'); vg.addColorStop(1,'#ff9900');
  ctx.fillStyle=vg;
  ctx.fillText('VICTORY!',HALF_CW,HALF_CH-70);
  ctx.restore();
  ctx.font='bold 20px monospace'; ctx.fillStyle='#aaff88';
  ctx.fillText('You conquered all 10 worlds!',HALF_CW,HALF_CH-20);
  ctx.font='16px monospace'; ctx.fillStyle='#aaddff';
  ctx.fillText(`Final Level: ${player.level}   Total XP: ${player.xp+player.level*100}`,HALF_CW,HALF_CH+20);
  ctx.font='14px monospace'; ctx.fillStyle='#ffcc88';
  ctx.fillText('You are a legend of this world.',HALF_CW,HALF_CH+52);
  // return to title
  const p2=Math.sin(titleTime*3)*0.15+0.85;
  ctx.font='bold 16px monospace'; ctx.fillStyle=`rgba(255,220,80,${p2})`;
  ctx.fillText('▶  Return to Title  (ENTER)',HALF_CW,HALF_CH+110);
  ctx.globalAlpha=1; ctx.textAlign='left';
}

// ── Helpers ────────────────────────────────────────────────────────────────
function wrapText(text,maxChars){
  const words=text.split(' '), lines=[];
  let line='';
  for(const w of words){
    if(line.length+w.length+1>maxChars){lines.push(line); line=w;}
    else line+=(line?' ':'')+w;
  }
  if(line)lines.push(line);
  return lines;
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath(); ctx.fill();
}

// ── Boot ───────────────────────────────────────────────────────────────────
requestAnimationFrame(ts=>{lastTime=ts; requestAnimationFrame(update);});
</script>
