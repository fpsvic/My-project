<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Top-Down World</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#111; display:flex; align-items:center; justify-content:center; height:100vh; overflow:hidden; }
canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ── Constants ──────────────────────────────────────────────────────────────
const TILE=32, WW=160, WH=120, CW=800, CH=600;
const HALF_CW=CW/2, HALF_CH=CH/2;

// ── Canvas ─────────────────────────────────────────────────────────────────
const canvas=document.getElementById('c');
canvas.width=CW; canvas.height=CH;
const ctx=canvas.getContext('2d');

// ── Noise ──────────────────────────────────────────────────────────────────
function hash(x,y,s=0){
  let n=x*374761393+y*668265263+(s*1376312589);
  n=(n^(n>>>13))*1274126177; return ((n^(n>>>16))&0x7fffffff)/0x7fffffff;
}
function smoothN(x,y,s=42){
  let v=0,amp=0.5,freq=1/32;
  for(let o=0;o<6;o++){
    const fx=x*freq,fy=y*freq;
    const ix=Math.floor(fx),iy=Math.floor(fy);
    const tx=fx-ix,ty=fy-iy;
    const u=tx*tx*(3-2*tx),w=ty*ty*(3-2*ty);
    v+=amp*(hash(ix,iy,s)*(1-u)*(1-w)+hash(ix+1,iy,s)*u*(1-w)+
            hash(ix,iy+1,s)*(1-u)*w+hash(ix+1,iy+1,s)*u*w);
    amp*=0.5; freq*=2;
  }
  return v;
}

// ── Tile types ─────────────────────────────────────────────────────────────
const T={
  DEEP_WATER:0,SHALLOW_WATER:1,SAND:2,GRASS:3,DARK_GRASS:4,
  FOREST:5,MOUNTAIN:6,SNOW:7,PATH:8,WALL:9,FLOOR:10,DOOR:11
};
const TCOLOR=['#1a6b9a','#2e8fc0','#d2b48c','#5a9e3a','#3d7a28','#1f5c1a','#8c8c8c','#e8e8f0','#8c7355','#5c4a3a','#b08050','#7a5530'];
const TWALK=[false,false,true,true,true,false,false,true,true,false,true,true];

// ── World generation ───────────────────────────────────────────────────────
const tiles=new Uint8Array(WW*WH);
const buildings=[];

const CENTRES=[[30,25],[120,25],[55,55],[100,55],[78,35],[40,90],[125,85],[78,95]];

function classify(h){
  if(h<0.08)return T.DEEP_WATER;
  if(h<0.17)return T.SHALLOW_WATER;
  if(h<0.23)return T.SAND;
  if(h<0.48)return T.GRASS;
  if(h<0.58)return T.DARK_GRASS;
  if(h<0.70)return T.FOREST;
  if(h<0.80)return T.MOUNTAIN;
  return T.SNOW;
}

function generateWorld(){
  for(let y=0;y<WH;y++){
    for(let x=0;x<WW;x++){
      const cx=(x/WW-0.5)*2, cy=(y/WH-0.5)*2;
      const dist=Math.sqrt(cx*cx+cy*cy);
      const h=smoothN(x,y,42)-dist*0.5;
      tiles[y*WW+x]=classify(h);
    }
  }
}

function canPlace(bx,by,bw,bh){
  if(bx<2||by<2||bx+bw>=WW-2||by+bh>=WH-2)return false;
  for(let dy=-1;dy<=bh;dy++)
    for(let dx=-1;dx<=bw;dx++){
      const t=tiles[(by+dy)*WW+(bx+dx)];
      if(!TWALK[t]||t===T.FOREST)return false;
    }
  for(const b of buildings)
    if(bx<b.x+b.w+2&&bx+bw>b.x-2&&by<b.y+b.h+2&&by+bh>b.y-2)return false;
  return true;
}

const BTYPE=['Inn','Shop','Blacksmith','Chapel','Cottage'];
function placeBuildings(){
  let seed=7777;
  function rnd(n){seed=((seed*1664525+1013904223)>>>0); return (seed>>>16)%n;}
  for(const vc of CENTRES){
    const count=2+rnd(4);
    for(let k=0;k<count;k++){
      const w=5+rnd(3)*2, h=5+rnd(3)*2;
      const bx=vc[0]+rnd(16)-8, by=vc[1]+rnd(16)-8;
      if(!canPlace(bx,by,w,h))continue;
      const b={x:bx,y:by,w,h,type:BTYPE[rnd(5)],interior:[]};
      for(let ly=0;ly<h;ly++){
        b.interior[ly]=[];
        for(let lx=0;lx<w;lx++){
          const edge=(lx===0||lx===w-1||ly===0||ly===h-1);
          b.interior[ly][lx]=edge?T.WALL:T.FLOOR;
        }
      }
      b.interior[h-1][Math.floor(w/2)]=T.DOOR;
      buildings.push(b);
    }
  }
}

function worldGet(tx,ty){
  if(tx<0||tx>=WW||ty<0||ty>=WH)return T.DEEP_WATER;
  for(const b of buildings){
    if(tx>=b.x&&tx<b.x+b.w&&ty>=b.y&&ty<b.y+b.h)
      return b.interior[ty-b.y][tx-b.x];
  }
  return tiles[ty*WW+tx];
}
function worldTerrain(tx,ty){
  if(tx<0||tx>=WW||ty<0||ty>=WH)return T.DEEP_WATER;
  return tiles[ty*WW+tx];
}

// ── Roads ──────────────────────────────────────────────────────────────────
function carvePath(x1,y1,x2,y2){
  let x=x1,y=y1;
  while(x!==x2||y!==y2){
    const t=tiles[y*WW+x];
    if(TWALK[t]&&t!==T.FOREST)tiles[y*WW+x]=T.PATH;
    if(x<x2)x++; else if(x>x2)x--;
    if(y<y2)y++; else if(y>y2)y--;
  }
}
function carveRoads(){
  for(let i=0;i<CENTRES.length-1;i++)
    carvePath(CENTRES[i][0],CENTRES[i][1],CENTRES[i+1][0],CENTRES[i+1][1]);
}

// ── Walkable check ─────────────────────────────────────────────────────────
function walkable(px,py){
  const R=10;
  const pts=[[px-R,py-R],[px+R,py-R],[px-R,py+R],[px+R,py+R]];
  for(const [cx,cy] of pts){
    const tx=Math.floor(cx/TILE), ty=Math.floor(cy/TILE);
    if(!TWALK[worldGet(tx,ty)])return false;
  }
  return true;
}

// ── Minimap pre-render ─────────────────────────────────────────────────────
const MM_W=160, MM_H=120;
const mmCanvas=document.createElement('canvas');
mmCanvas.width=MM_W; mmCanvas.height=MM_H;
const mmCtx=mmCanvas.getContext('2d');
function buildMinimap(){
  const id=mmCtx.createImageData(MM_W,MM_H);
  const d=id.data;
  for(let y=0;y<WH;y++){
    for(let x=0;x<WW;x++){
      const t=worldTerrain(x,y);
      const hex=TCOLOR[t];
      const r=parseInt(hex.slice(1,3),16);
      const g=parseInt(hex.slice(3,5),16);
      const bv=parseInt(hex.slice(5,7),16);
      const i=(y*MM_W+x)*4;
      d[i]=r; d[i+1]=g; d[i+2]=bv; d[i+3]=255;
    }
  }
  // buildings as light tan
  for(const b of buildings){
    for(let by=b.y;by<b.y+b.h;by++){
      for(let bx=b.x;bx<b.x+b.w;bx++){
        const i=(by*MM_W+bx)*4;
        d[i]=180; d[i+1]=150; d[i+2]=100; d[i+3]=255;
      }
    }
  }
  mmCtx.putImageData(id,0,0);
}

// ── NPC definitions ────────────────────────────────────────────────────────
const NPC_JOBS=['Villager','Merchant','Guard','Elder','Wanderer'];
const NPC_NAMES=['Alice','Bob','Cara','Dorn','Elsa','Finn','Gara','Holt','Ivy','Jak','Kira','Lorn','Mira','Nox','Ora','Pip','Qin','Ryn','Sara','Tav'];
const NPC_DIALOGUE={
  Villager:["Fine weather today, isn't it?","Watch out for slimes near the pond.","Have you visited the inn yet?","My crops are doing well this season.","Strange noises from the forest at night..."],
  Merchant:["Best prices in the region!","Looking to trade? I have fine wares.","Stock up before heading into the wilds.","Gold is scarce these days.","Come back when you have coin!"],
  Guard:["Halt! ...oh, you're friendly.","Keep the peace, traveller.","Report any monsters to the garrison.","Stay on the lit paths after dark.","I've seen three trolls this week alone."],
  Elder:["The old forest holds many secrets.","In my youth, this land was safer.","Legends speak of treasure beneath the mountains.","Respect the land and it will respect you.","The village has stood a hundred years."],
  Wanderer:["I come from far beyond the eastern sea.","Every road leads somewhere interesting.","I've seen stranger things than you can imagine.","The wind calls me ever onward.","Rest when you can — the road is long."]
};

// ── Enemy definitions ──────────────────────────────────────────────────────
const ENEMY_DEF={
  Slime: {hp:30,dmg:8,xp:40,spd:1.5,ranged:false,color:'#55ee55',size:10},
  Orc:   {hp:60,dmg:14,xp:55,spd:2.0,ranged:false,color:'#88aa22',size:14},
  Skeleton:{hp:40,dmg:10,xp:50,spd:1.8,ranged:false,color:'#ddddcc',size:12},
  Archer:{hp:45,dmg:12,xp:60,spd:1.6,ranged:true, color:'#cc8844',size:12,range:5*TILE},
  Mage:  {hp:35,dmg:18,xp:70,spd:1.4,ranged:true, color:'#aa55ee',size:11,range:7*TILE},
  Troll: {hp:120,dmg:22,xp:80,spd:1.2,ranged:false,color:'#667744',size:18}
};
const ENEMY_KINDS=Object.keys(ENEMY_DEF);

// ── Item definitions ───────────────────────────────────────────────────────
const ITEM_DEF={
  Sword:   {cat:'MELEE', atk:15, color:'#aaaacc',icon:'⚔'},
  Axe:     {cat:'MELEE', atk:20, color:'#cc8833',icon:'🪓'},
  Dagger:  {cat:'MELEE', atk:10, color:'#88ccff',icon:'🗡'},
  Bow:     {cat:'RANGED',atk:12, color:'#aa8844',icon:'🏹'},
  Pistol:  {cat:'RANGED',atk:25, color:'#888888',icon:'🔫'},
  Apple:   {cat:'FOOD',  hp:20,  color:'#ee4444',icon:'🍎'},
  Bread:   {cat:'FOOD',  hp:35,  color:'#ddaa55',icon:'🍞'},
  Potion:  {cat:'FOOD',  hp:60,  color:'#ff55aa',icon:'🧪'},
  Shield:  {cat:'ARMOUR',def:5,  color:'#5588aa',icon:'🛡'},
  Helmet:  {cat:'ARMOUR',def:3,  color:'#aa9955',icon:'⛑'},
  Chainmail:{cat:'ARMOUR',def:8, color:'#888899',icon:'🧥'}
};
const ITEM_KINDS=Object.keys(ITEM_DEF);

// ── State ──────────────────────────────────────────────────────────────────
let waterTime=0, spawnTimer=5, gameOver=false;

const player={
  x:78*TILE+TILE/2, y:35*TILE+TILE/2,
  hp:100, maxHp:100, atk:10, def:0, xp:0, level:1,
  dead:false, dir:0, frame:0, frameT:0, moving:false,
  atkCd:0, iFrames:0,
  inv:new Array(8).fill(null), invCount:0, equip:-1
};
const enemies=[];
const npcs=[];
const items=[];
const projs=[];
const floats=[];
let camX=0, camY=0;

// ── Input ──────────────────────────────────────────────────────────────────
const keys={};
document.addEventListener('keydown',e=>{keys[e.code]=true; handleKey(e.code);});
document.addEventListener('keyup',e=>{keys[e.code]=false;});

function handleKey(code){
  if(gameOver){if(code==='KeyR')resetGame(); return;}
  if(code==='KeyF')playerAttack();
  if(code==='KeyE')talkNearby();
  for(let i=0;i<8;i++)if(code===`Digit${i+1}`)player.equip=player.inv[i]?i:-1;
}

// ── Spawn NPCs ─────────────────────────────────────────────────────────────
function spawnNPCs(){
  let seed=12345;
  function rnd(n){seed=((seed*1664525+1013904223)>>>0); return (seed>>>16)%n;}
  for(const vc of CENTRES){
    const count=2+rnd(3);
    for(let k=0;k<count;k++){
      const tx=vc[0]+rnd(10)-5, ty=vc[1]+rnd(10)-5;
      if(!TWALK[worldTerrain(tx,ty)])continue;
      npcs.push({
        x:tx*TILE+TILE/2, y:ty*TILE+TILE/2,
        tx:tx*TILE+TILE/2, ty:ty*TILE+TILE/2,
        job:NPC_JOBS[rnd(5)], name:NPC_NAMES[rnd(NPC_NAMES.length)],
        speech:'', speechTimer:0, idleTimer:2+rnd(3),
        moving:false, dir:0, frame:0, frameT:0, speed:40+rnd(20),
        seed:rnd(10000)
      });
    }
  }
}

// ── Spawn initial enemies ──────────────────────────────────────────────────
function spawnInitial(){
  let seed=99991;
  function rnd(n){seed=((seed*1664525+1013904223)>>>0); return (seed>>>16)%n;}
  for(let i=0;i<40;i++){
    const tx=rnd(WW), ty=rnd(WH);
    const t=worldTerrain(tx,ty);
    if(!TWALK[t]||t===T.FOREST)continue;
    const kind=ENEMY_KINDS[rnd(ENEMY_KINDS.length)];
    spawnEnemy(tx*TILE+TILE/2, ty*TILE+TILE/2, kind);
  }
}

function spawnEnemy(x,y,kind){
  const d=ENEMY_DEF[kind];
  enemies.push({kind,x,y,hp:d.hp,maxHp:d.hp,dead:false,
    dir:0,frame:0,frameT:0,moving:false,
    atkTimer:0,hitFlash:0,seed:Math.random()*10000|0});
}

function trySpawnEnemy(){
  const px=player.x/TILE|0, py=player.y/TILE|0;
  for(let attempt=0;attempt<20;attempt++){
    const ang=Math.random()*Math.PI*2;
    const dist=15+Math.random()*10;
    const tx=(px+Math.cos(ang)*dist)|0;
    const ty=(py+Math.sin(ang)*dist)|0;
    if(tx<0||tx>=WW||ty<0||ty>=WH)continue;
    const t=worldTerrain(tx,ty);
    if(!TWALK[t]||t===T.FOREST)continue;
    const kind=ENEMY_KINDS[Math.random()*ENEMY_KINDS.length|0];
    spawnEnemy(tx*TILE+TILE/2, ty*TILE+TILE/2, kind);
    return;
  }
}

// ── Spawn items ────────────────────────────────────────────────────────────
function spawnInitialItems(){
  let seed=54321;
  function rnd(n){seed=((seed*1664525+1013904223)>>>0); return (seed>>>16)%n;}
  for(let i=0;i<60;i++){
    const tx=rnd(WW), ty=rnd(WH);
    const t=worldTerrain(tx,ty);
    if(!TWALK[t]||t===T.FOREST)continue;
    const kind=ITEM_KINDS[rnd(ITEM_KINDS.length)];
    items.push({kind,x:tx*TILE+TILE/2,y:ty*TILE+TILE/2,collected:false,bob:rnd(628)/100});
  }
}

// ── Talk ───────────────────────────────────────────────────────────────────
function talkNearby(){
  for(const n of npcs){
    const dx=n.x-player.x, dy=n.y-player.y;
    if(dx*dx+dy*dy<(2.5*TILE)**2){
      const lines=NPC_DIALOGUE[n.job];
      n.speech=lines[(n.seed+floats.length)%lines.length];
      n.speechTimer=3.5;
      return;
    }
  }
}

// ── Player attack ──────────────────────────────────────────────────────────
function playerAttack(){
  if(player.atkCd>0||player.dead)return;
  player.atkCd=0.4;
  const item=player.equip>=0?player.inv[player.equip]:null;
  const isRanged=item&&ITEM_DEF[item.kind]&&ITEM_DEF[item.kind].cat==='RANGED';
  const atkDmg=player.atk+(item&&ITEM_DEF[item.kind].atk||0);
  if(isRanged){
    const dirs=[[0,-1],[0,1],[-1,0],[1,0]];
    const [vx,vy]=dirs[player.dir];
    projs.push({x:player.x,y:player.y,vx:vx*320,vy:vy*320,fromPlayer:true,damage:atkDmg,life:1.5,dead:false});
  } else {
    const range=2.2*TILE;
    for(const e of enemies){
      if(e.dead)continue;
      const dx=e.x-player.x, dy=e.y-player.y;
      if(dx*dx+dy*dy<range*range){
        damageEnemy(e,atkDmg);
      }
    }
  }
}

function damageEnemy(e,dmg){
  e.hp-=dmg; e.hitFlash=0.2;
  floats.push({text:'-'+dmg,x:e.x,y:e.y-20,color:'#ff4444',life:1.0});
  if(e.hp<=0){
    e.dead=true;
    const xp=ENEMY_DEF[e.kind].xp;
    player.xp+=xp;
    floats.push({text:'+'+xp+' XP',x:e.x,y:e.y-36,color:'#ffdd00',life:1.2});
    checkLevelUp();
    // drop item
    if(Math.random()<0.3){
      const kind=ITEM_KINDS[Math.random()*ITEM_KINDS.length|0];
      items.push({kind,x:e.x,y:e.y,collected:false,bob:Math.random()*6.28});
    }
  }
}

function checkLevelUp(){
  const needed=player.level*100;
  if(player.xp>=needed){
    player.xp-=needed; player.level++;
    player.atk+=4; player.def+=2; player.maxHp+=10; player.hp=Math.min(player.hp+20,player.maxHp);
    floats.push({text:'LEVEL UP!',x:player.x,y:player.y-60,color:'#ffffaa',life:2.0});
  }
}

// ── Update ─────────────────────────────────────────────────────────────────
let lastTime=0;
function update(ts){
  const dt=Math.min((ts-lastTime)/1000,0.05);
  lastTime=ts;
  if(gameOver){render(); requestAnimationFrame(update); return;}
  waterTime+=dt;

  // player movement
  if(!player.dead){
    let dx=0,dy=0;
    if(keys['ArrowLeft']||keys['KeyA']){dx=-1; player.dir=2;}
    if(keys['ArrowRight']||keys['KeyD']){dx=1; player.dir=3;}
    if(keys['ArrowUp']||keys['KeyW']){dy=-1; player.dir=1;}
    if(keys['ArrowDown']||keys['KeyS']){dy=1; player.dir=0;}
    const speed=130;
    if(dx!==0&&dy!==0){const s=1/Math.SQRT2; dx*=s; dy*=s;}
    player.moving=(dx!==0||dy!==0);
    if(player.moving){
      const nx=player.x+dx*speed*dt;
      if(walkable(nx,player.y))player.x=nx;
      const ny=player.y+dy*speed*dt;
      if(walkable(player.x,ny))player.y=ny;
      player.frameT+=dt;
      if(player.frameT>0.15){player.frame=(player.frame+1)%4; player.frameT=0;}
    } else {player.frame=0;}
    player.atkCd=Math.max(0,player.atkCd-dt);
    player.iFrames=Math.max(0,player.iFrames-dt);
  }

  // enemies
  for(const e of enemies){
    if(e.dead)continue;
    const d=ENEMY_DEF[e.kind];
    const dx=player.x-e.x, dy=player.y-e.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<200){
      if(d.ranged&&dist<d.range&&dist>TILE*2){
        e.moving=false;
        e.atkTimer-=dt;
        if(e.atkTimer<=0){
          e.atkTimer=2.0;
          const spd=200;
          projs.push({x:e.x,y:e.y,vx:(dx/dist)*spd,vy:(dy/dist)*spd,fromPlayer:false,damage:d.dmg,life:2.0,dead:false});
        }
      } else if(!d.ranged||dist>=d.range){
        e.moving=true;
        const nx=e.x+(dx/dist)*d.spd*TILE*dt;
        const ny=e.y+(dy/dist)*d.spd*TILE*dt;
        if(walkable(nx,e.y))e.x=nx;
        if(walkable(e.x,ny))e.y=ny;
        if(Math.abs(dx)>Math.abs(dy)) e.dir=dx>0?3:2; else e.dir=dy>0?0:1;
        e.frameT+=dt;
        if(e.frameT>0.2){e.frame=(e.frame+1)%4; e.frameT=0;}
        // melee hit
        if(dist<TILE*1.2){
          e.atkTimer-=dt;
          if(e.atkTimer<=0){
            e.atkTimer=1.0;
            if(player.iFrames<=0){
              const dmg=Math.max(1,d.dmg-player.def);
              player.hp-=dmg; player.iFrames=0.5;
              floats.push({text:'-'+dmg,x:player.x,y:player.y-30,color:'#ff8888',life:0.8});
              if(player.hp<=0){player.hp=0; player.dead=true; gameOver=true;}
            }
          }
        }
      }
    } else { e.moving=false; }
    e.hitFlash=Math.max(0,e.hitFlash-dt);
  }

  // projectiles
  for(const p of projs){
    if(p.dead)continue;
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt;
    if(p.life<=0){p.dead=true; continue;}
    const tx=Math.floor(p.x/TILE), ty=Math.floor(p.y/TILE);
    if(!TWALK[worldGet(tx,ty)]){p.dead=true; continue;}
    if(p.fromPlayer){
      for(const e of enemies){
        if(e.dead)continue;
        const dx=e.x-p.x, dy=e.y-p.y;
        if(dx*dx+dy*dy<(ENEMY_DEF[e.kind].size+4)**2){
          damageEnemy(e,p.damage); p.dead=true; break;
        }
      }
    } else {
      const dx=player.x-p.x, dy=player.y-p.y;
      if(dx*dx+dy*dy<14*14&&player.iFrames<=0){
        const dmg=Math.max(1,p.damage-player.def);
        player.hp-=dmg; player.iFrames=0.5; p.dead=true;
        floats.push({text:'-'+dmg,x:player.x,y:player.y-30,color:'#ff8888',life:0.8});
        if(player.hp<=0){player.hp=0; player.dead=true; gameOver=true;}
      }
    }
  }

  // items pickup
  for(const it of items){
    if(it.collected)continue;
    it.bob+=dt*2;
    const dx=it.x-player.x, dy=it.y-player.y;
    if(dx*dx+dy*dy<(TILE*0.9)**2){
      const d=ITEM_DEF[it.kind];
      if(d.cat==='FOOD'){
        player.hp=Math.min(player.maxHp,player.hp+d.hp);
        floats.push({text:'+'+d.hp+' HP',x:player.x,y:player.y-40,color:'#55ff88',life:1.0});
        it.collected=true;
      } else if(player.invCount<8){
        player.inv[player.invCount++]=it;
        floats.push({text:'Got '+it.kind,x:player.x,y:player.y-40,color:'#ffdd55',life:1.0});
        it.collected=true;
      }
    }
  }

  // NPCs
  for(const n of npcs){
    n.speechTimer=Math.max(0,n.speechTimer-dt);
    if(n.speechTimer<=0)n.speech='';
    if(n.moving){
      const dx=n.tx-n.x, dy=n.ty-n.y;
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<4){n.moving=false; n.idleTimer=2+Math.random()*3;}
      else{
        const nx=n.x+(dx/dist)*n.speed*dt;
        const ny=n.y+(dy/dist)*n.speed*dt;
        if(walkable(nx,n.y))n.x=nx;
        if(walkable(n.x,ny))n.y=ny;
        if(Math.abs(dx)>Math.abs(dy)) n.dir=dx>0?3:2; else n.dir=dy>0?0:1;
        n.frameT+=dt;
        if(n.frameT>0.2){n.frame=(n.frame+1)%4; n.frameT=0;}
      }
    } else {
      n.idleTimer-=dt;
      if(n.idleTimer<=0){
        n.moving=true;
        const angle=Math.random()*Math.PI*2;
        const dist=2+Math.random()*3;
        n.tx=n.x+Math.cos(angle)*dist*TILE;
        n.ty=n.y+Math.sin(angle)*dist*TILE;
      }
    }
  }

  // floats
  for(const f of floats){f.y-=40*dt; f.life-=dt;}

  // spawn timer
  spawnTimer-=dt;
  if(spawnTimer<=0){spawnTimer=8; trySpawnEnemy();}

  updateCamera();
  render();
  requestAnimationFrame(update);
}

function updateCamera(){
  camX=player.x-HALF_CW;
  camY=player.y-HALF_CH;
  camX=Math.max(0,Math.min(WW*TILE-CW,camX));
  camY=Math.max(0,Math.min(WH*TILE-CH,camY));
}

// ── Render ─────────────────────────────────────────────────────────────────
const DIRS=[[0,1],[0,-1],[-1,0],[1,0]]; // down,up,left,right

function render(){
  ctx.clearRect(0,0,CW,CH);
  drawWorld();
  // y-sort entities
  const drawables=[];
  for(const e of enemies) if(!e.dead&&onScreen(e.x,e.y)) drawables.push({y:e.y,draw:()=>drawEnemy(e)});
  for(const n of npcs)    if(onScreen(n.x,n.y))           drawables.push({y:n.y,draw:()=>drawNPC(n)});
  drawables.push({y:player.y,draw:drawPlayer});
  drawables.sort((a,b)=>a.y-b.y);
  for(const d of drawables) d.draw();
  drawItems();
  drawProjectiles();
  drawFloats();
  drawHUD();
  drawInventoryBar();
  drawMinimap();
  drawVignette();
  if(gameOver) drawGameOver();
}

function onScreen(wx,wy){
  const sx=wx-camX, sy=wy-camY;
  return sx>-64&&sx<CW+64&&sy>-64&&sy<CH+64;
}

function drawWorld(){
  const tx0=Math.floor(camX/TILE), ty0=Math.floor(camY/TILE);
  const tx1=Math.ceil((camX+CW)/TILE), ty1=Math.ceil((camY+CH)/TILE);
  for(let ty=ty0;ty<=ty1;ty++){
    for(let tx=tx0;tx<=tx1;tx++){
      const t=worldGet(tx,ty);
      const px=tx*TILE-camX|0, py=ty*TILE-camY|0;
      drawTile(t,tx,ty,px,py);
    }
  }
  // building labels
  for(const b of buildings){
    const bsx=(b.x+b.w/2)*TILE-camX;
    const bsy=(b.y-1)*TILE-camY;
    if(bsx<-60||bsx>CW+60||bsy<-20||bsy>CH+20)continue;
    ctx.fillStyle='rgba(0,0,0,0.6)';
    ctx.font='bold 10px monospace';
    const tw=ctx.measureText(b.type).width;
    ctx.fillRect(bsx-tw/2-3,bsy-11,tw+6,14);
    ctx.fillStyle='#ffeeaa';
    ctx.fillText(b.type,bsx-tw/2,bsy);
  }
}

function drawTile(t,tx,ty,px,py){
  ctx.fillStyle=TCOLOR[t];
  // water animation
  if(t===T.DEEP_WATER||t===T.SHALLOW_WATER){
    const phase=Math.sin(waterTime*1.5+(tx+ty)*0.4)*0.06;
    const bright=t===T.DEEP_WATER?0.9+phase:1+phase;
    const base=t===T.DEEP_WATER?'#1a6b9a':'#2e8fc0';
    const r=parseInt(base.slice(1,3),16)*bright|0;
    const g=parseInt(base.slice(3,5),16)*bright|0;
    const bv=parseInt(base.slice(5,7),16)*bright|0;
    ctx.fillStyle=`rgb(${Math.min(255,r)},${Math.min(255,g)},${Math.min(255,bv)})`;
  }
  ctx.fillRect(px,py,TILE,TILE);
  // decorations
  if(t===T.GRASS){
    if(hash(tx,ty,1)<0.2){
      ctx.fillStyle='#4a8a2a';
      ctx.fillRect(px+4,py+8,2,6);
      ctx.fillRect(px+9,py+6,2,8);
      ctx.fillRect(px+14,py+9,2,5);
      ctx.fillRect(px+20,py+7,2,7);
    }
  } else if(t===T.DARK_GRASS){
    if(hash(tx,ty,2)<0.3){
      ctx.fillStyle='#2d601a';
      ctx.fillRect(px+6,py+5,3,9);
      ctx.fillRect(px+16,py+7,3,7);
    }
  } else if(t===T.FOREST){
    ctx.fillStyle='#0d3a0a';
    ctx.beginPath(); ctx.arc(px+TILE/2,py+TILE/2,11,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#1a5c14';
    ctx.beginPath(); ctx.arc(px+TILE/2,py+TILE/2,8,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#2a7a20';
    ctx.beginPath(); ctx.arc(px+TILE/2-3,py+TILE/2-3,5,0,Math.PI*2); ctx.fill();
  } else if(t===T.MOUNTAIN){
    ctx.fillStyle='#6a6a6a';
    ctx.beginPath(); ctx.moveTo(px+TILE/2,py+4); ctx.lineTo(px+4,py+TILE-4); ctx.lineTo(px+TILE-4,py+TILE-4); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#aaaaaa';
    ctx.beginPath(); ctx.moveTo(px+TILE/2,py+4); ctx.lineTo(px+TILE/2-5,py+14); ctx.lineTo(px+TILE/2+5,py+14); ctx.closePath(); ctx.fill();
  } else if(t===T.SNOW){
    ctx.fillStyle='#ccccdd';
    ctx.beginPath(); ctx.moveTo(px+TILE/2,py+2); ctx.lineTo(px+5,py+16); ctx.lineTo(px+TILE-5,py+16); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#ffffff';
    ctx.beginPath(); ctx.moveTo(px+TILE/2,py+2); ctx.lineTo(px+TILE/2-4,py+10); ctx.lineTo(px+TILE/2+4,py+10); ctx.closePath(); ctx.fill();
  } else if(t===T.WALL){
    ctx.strokeStyle='#3a2a1a'; ctx.lineWidth=1;
    ctx.strokeRect(px+1,py+1,TILE-2,TILE-2);
    ctx.fillStyle='#4a3830';
    ctx.fillRect(px+2,py+2,TILE/2-2,TILE/2-2);
    ctx.fillRect(px+TILE/2+1,py+TILE/2+1,TILE/2-3,TILE/2-3);
  } else if(t===T.FLOOR){
    ctx.strokeStyle='#8a6040'; ctx.lineWidth=0.5;
    ctx.beginPath(); ctx.moveTo(px+TILE/2,py); ctx.lineTo(px+TILE/2,py+TILE); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(px,py+TILE/2); ctx.lineTo(px+TILE,py+TILE/2); ctx.stroke();
  } else if(t===T.DOOR){
    ctx.fillStyle='#6a3820';
    ctx.fillRect(px+6,py+4,TILE-12,TILE-4);
    ctx.fillStyle='#aa6640';
    ctx.fillRect(px+8,py+6,TILE-16,TILE-8);
    ctx.fillStyle='#ffdd88';
    ctx.beginPath(); ctx.arc(px+TILE-10,py+TILE/2,2,0,Math.PI*2); ctx.fill();
  } else if(t===T.PATH){
    ctx.fillStyle='#7a6345';
    ctx.fillRect(px+2,py+2,TILE-4,TILE-4);
    if(hash(tx,ty,3)<0.3){
      ctx.fillStyle='#9a8055';
      ctx.fillRect(px+4+hash(tx,ty,4)*10|0,py+6,4,4);
    }
  } else if(t===T.SAND){
    if(hash(tx,ty,5)<0.15){
      ctx.fillStyle='#c2a47c';
      ctx.beginPath(); ctx.arc(px+8+hash(tx,ty,6)*16|0,py+8+hash(tx,ty,7)*16|0,2,0,Math.PI*2); ctx.fill();
    }
  }
}

function drawEnemy(e){
  const d=ENEMY_DEF[e.kind];
  const sx=e.x-camX|0, sy=e.y-camY|0;
  const bob=Math.sin(e.frameT*8)*2;
  // shadow
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(sx,sy+d.size-2,d.size*0.8,d.size*0.3,0,0,Math.PI*2); ctx.fill();
  // body
  ctx.fillStyle=e.hitFlash>0?'#ffffff':d.color;
  ctx.beginPath(); ctx.arc(sx,sy-d.size+bob,d.size,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.5)'; ctx.lineWidth=1.5; ctx.stroke();
  // eyes
  ctx.fillStyle='#000';
  const eyeOff=e.dir===2?-4:(e.dir===3?4:0);
  ctx.beginPath(); ctx.arc(sx-3+eyeOff,sy-d.size-2+bob,2,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(sx+3+eyeOff,sy-d.size-2+bob,2,0,Math.PI*2); ctx.fill();
  // health bar
  const barW=d.size*3, barH=4;
  const bx=sx-barW/2, by=sy-d.size*2-8;
  ctx.fillStyle='#550000'; ctx.fillRect(bx,by,barW,barH);
  ctx.fillStyle='#ee2222'; ctx.fillRect(bx,by,barW*(e.hp/e.maxHp),barH);
  ctx.strokeStyle='#000'; ctx.lineWidth=0.5; ctx.strokeRect(bx,by,barW,barH);
}

function drawNPC(n){
  const sx=n.x-camX|0, sy=n.y-camY|0;
  const bob=n.moving?Math.sin(n.frameT*8)*2:0;
  // shadow
  ctx.fillStyle='rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(sx,sy+10,9,4,0,0,Math.PI*2); ctx.fill();
  // body
  const colors={Villager:'#4488cc',Merchant:'#cc8822',Guard:'#445566',Elder:'#886644',Wanderer:'#668844'};
  ctx.fillStyle=colors[n.job]||'#4488cc';
  ctx.fillRect(sx-7,sy-16+bob,14,18);
  // head
  ctx.fillStyle='#f5d5a0';
  ctx.beginPath(); ctx.arc(sx,sy-20+bob,8,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.3)'; ctx.lineWidth=1; ctx.stroke();
  // eyes
  ctx.fillStyle='#333';
  ctx.beginPath(); ctx.arc(sx-3,sy-20+bob,1.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(sx+3,sy-20+bob,1.5,0,Math.PI*2); ctx.fill();
  // name
  ctx.font='10px monospace';
  ctx.fillStyle='#ffffcc';
  ctx.textAlign='center';
  ctx.fillText(n.name,sx,sy-32+bob);
  ctx.fillStyle='#aaaaff';
  ctx.fillText('['+n.job[0]+']',sx,sy-23+bob);
  ctx.textAlign='left';
  // speech bubble
  if(n.speech&&n.speechTimer>0){
    const lines=wrapText(n.speech,18);
    const bh=lines.length*14+10;
    const bw=140;
    const bx=sx-bw/2, by2=sy-50-bh+bob;
    ctx.fillStyle='rgba(0,0,0,0.75)';
    roundRect(bx,by2,bw,bh,6);
    ctx.fillStyle='#fff';
    ctx.font='11px monospace';
    ctx.textAlign='center';
    for(let i=0;i<lines.length;i++)
      ctx.fillText(lines[i],sx,by2+16+i*14);
    ctx.textAlign='left';
    // tail
    ctx.fillStyle='rgba(0,0,0,0.75)';
    ctx.beginPath(); ctx.moveTo(sx-5,by2+bh); ctx.lineTo(sx+5,by2+bh); ctx.lineTo(sx,by2+bh+8); ctx.closePath(); ctx.fill();
  }
}

function wrapText(text,maxChars){
  const words=text.split(' '), lines=[];
  let line='';
  for(const w of words){
    if(line.length+w.length+1>maxChars){lines.push(line); line=w;}
    else line+=(line?' ':'')+w;
  }
  if(line)lines.push(line);
  return lines;
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath(); ctx.fill();
}

function drawPlayer(){
  if(player.dead)return;
  const sx=player.x-camX|0, sy=player.y-camY|0;
  const bob=player.moving?Math.sin(player.frameT*8)*2:0;
  const flash=player.iFrames>0&&Math.sin(player.iFrames*40)>0;
  if(flash)return;
  // shadow
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(sx,sy+10,11,4,0,0,Math.PI*2); ctx.fill();
  // body
  ctx.fillStyle='#3366cc';
  ctx.fillRect(sx-8,sy-16+bob,16,18);
  ctx.strokeStyle='#1133aa'; ctx.lineWidth=1.5; ctx.strokeRect(sx-8,sy-16+bob,16,18);
  // head
  ctx.fillStyle='#f5d5a0';
  ctx.beginPath(); ctx.arc(sx,sy-20+bob,9,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#cc9966'; ctx.lineWidth=1; ctx.stroke();
  // eyes
  ctx.fillStyle='#222';
  const eyeX=player.dir===2?-4:(player.dir===3?4:0);
  ctx.beginPath(); ctx.arc(sx-3+eyeX,sy-21+bob,1.8,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(sx+3+eyeX,sy-21+bob,1.8,0,Math.PI*2); ctx.fill();
  // sword indicator
  if(player.atkCd>0){
    ctx.strokeStyle='#ffdd44'; ctx.lineWidth=3;
    const dirs=[[0,1],[0,-1],[-1,0],[1,0]];
    const [vx,vy]=dirs[player.dir];
    ctx.beginPath(); ctx.moveTo(sx,sy-8+bob); ctx.lineTo(sx+vx*20,sy-8+bob+vy*20); ctx.stroke();
  }
}

function drawItems(){
  for(const it of items){
    if(it.collected)continue;
    if(!onScreen(it.x,it.y))continue;
    const sx=it.x-camX|0, sy=it.y-camY|0;
    const bob=Math.sin(it.bob)*4;
    const d=ITEM_DEF[it.kind];
    // glow
    ctx.shadowColor=d.color; ctx.shadowBlur=10;
    ctx.fillStyle=d.color;
    ctx.beginPath(); ctx.arc(sx,sy+bob,8,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    ctx.font='12px serif'; ctx.textAlign='center';
    ctx.fillText(d.icon,sx,sy+4+bob);
    ctx.textAlign='left';
    // label
    ctx.font='9px monospace'; ctx.fillStyle='#fff';
    ctx.textAlign='center';
    ctx.fillText(it.kind,sx,sy-12+bob);
    ctx.textAlign='left';
  }
}

function drawProjectiles(){
  for(const p of projs){
    if(p.dead)continue;
    const sx=p.x-camX|0, sy=p.y-camY|0;
    ctx.fillStyle=p.fromPlayer?'#ffff44':'#ff4444';
    ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.arc(sx,sy,4,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
  }
}

function drawFloats(){
  for(const f of floats){
    if(f.life<=0)continue;
    ctx.globalAlpha=Math.min(1,f.life);
    ctx.font='bold 14px monospace';
    ctx.fillStyle=f.color;
    ctx.strokeStyle='rgba(0,0,0,0.8)'; ctx.lineWidth=3;
    const sx=f.x-camX, sy=f.y-camY;
    ctx.strokeText(f.text,sx,sy);
    ctx.fillText(f.text,sx,sy);
  }
  ctx.globalAlpha=1;
}

function drawHUD(){
  // HP bar
  ctx.fillStyle='rgba(0,0,0,0.6)';
  ctx.fillRect(10,10,154,18);
  ctx.fillStyle='#cc2222';
  ctx.fillRect(11,11,(player.hp/player.maxHp)*152,16);
  ctx.fillStyle='#ff4444';
  ctx.fillRect(11,11,Math.min(152,player.hp/player.maxHp*152),8);
  ctx.strokeStyle='#888'; ctx.lineWidth=1; ctx.strokeRect(10,10,154,18);
  ctx.font='11px monospace'; ctx.fillStyle='#fff';
  ctx.fillText(`HP ${player.hp}/${player.maxHp}`,14,23);

  // XP bar
  ctx.fillStyle='rgba(0,0,0,0.6)';
  ctx.fillRect(10,32,154,10);
  const xpNeeded=player.level*100;
  ctx.fillStyle='#2244cc';
  ctx.fillRect(11,33,(player.xp/xpNeeded)*152,8);
  ctx.strokeStyle='#888'; ctx.lineWidth=1; ctx.strokeRect(10,32,154,10);
  ctx.font='9px monospace'; ctx.fillStyle='#aac4ff';
  ctx.fillText(`LV${player.level}  XP ${player.xp}/${xpNeeded}`,14,41);

  // zone/pos
  const tx=player.x/TILE|0, ty=player.y/TILE|0;
  const zones={[T.DEEP_WATER]:'Deep Sea',[T.SHALLOW_WATER]:'Shore',[T.SAND]:'Beach',[T.GRASS]:'Grassland',[T.DARK_GRASS]:'Meadow',[T.FOREST]:'Forest',[T.MOUNTAIN]:'Mountains',[T.SNOW]:'Snowfields',[T.PATH]:'Road',[T.WALL]:'Building',[T.FLOOR]:'Building',[T.DOOR]:'Building'};
  const zone=zones[worldTerrain(tx,ty)]||'Unknown';
  ctx.font='10px monospace'; ctx.fillStyle='#ccc';
  ctx.fillText(`${zone} (${tx},${ty})`,10,60);

  // controls
  ctx.fillStyle='rgba(0,0,0,0.4)';
  ctx.fillRect(10,CH-30,220,20);
  ctx.font='9px monospace'; ctx.fillStyle='#888';
  ctx.fillText('WASD:Move  F:Attack  E:Talk  1-8:Equip',14,CH-16);
}

function drawInventoryBar(){
  const slotW=40, slotH=40, gap=4;
  const totalW=8*(slotW+gap)-gap;
  const startX=(CW-totalW)/2, startY=CH-slotH-10;
  ctx.fillStyle='rgba(0,0,0,0.7)';
  ctx.fillRect(startX-4,startY-4,totalW+8,slotH+8);
  for(let i=0;i<8;i++){
    const x=startX+i*(slotW+gap), y=startY;
    ctx.fillStyle=player.equip===i?'rgba(255,220,50,0.3)':'rgba(255,255,255,0.08)';
    ctx.fillRect(x,y,slotW,slotH);
    ctx.strokeStyle=player.equip===i?'#ffdd22':'#555';
    ctx.lineWidth=player.equip===i?2:1;
    ctx.strokeRect(x,y,slotW,slotH);
    ctx.font='9px monospace'; ctx.fillStyle='#888'; ctx.textAlign='center';
    ctx.fillText(i+1,x+slotW/2,y+slotH-3);
    ctx.textAlign='left';
    const it=player.inv[i];
    if(it){
      const d=ITEM_DEF[it.kind];
      ctx.font='18px serif'; ctx.textAlign='center';
      ctx.fillText(d.icon,x+slotW/2,y+24);
      ctx.textAlign='left';
      ctx.font='8px monospace'; ctx.fillStyle='#ddd'; ctx.textAlign='center';
      ctx.fillText(it.kind,x+slotW/2,y+12);
      ctx.textAlign='left';
    }
  }
}

function drawMinimap(){
  const MM_DISP_W=160, MM_DISP_H=120;
  const mmX=CW-MM_DISP_W-10, mmY=10;
  // background
  ctx.fillStyle='rgba(0,0,0,0.6)';
  ctx.fillRect(mmX-2,mmY-2,MM_DISP_W+4,MM_DISP_H+4);
  ctx.drawImage(mmCanvas,mmX,mmY,MM_DISP_W,MM_DISP_H);
  // player dot
  const px=(player.x/TILE)/WW*MM_DISP_W, py=(player.y/TILE)/WH*MM_DISP_H;
  ctx.fillStyle='#ffffff';
  ctx.beginPath(); ctx.arc(mmX+px,mmY+py,3,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#000'; ctx.lineWidth=1; ctx.stroke();
  // border
  ctx.strokeStyle='#4a9eff'; ctx.lineWidth=1.5; ctx.strokeRect(mmX-2,mmY-2,MM_DISP_W+4,MM_DISP_H+4);
  ctx.font='9px monospace'; ctx.fillStyle='#aaa';
  ctx.fillText('MAP',mmX+2,mmY+MM_DISP_H+14);
}

function drawVignette(){
  const grad=ctx.createRadialGradient(HALF_CW,HALF_CH,HALF_CH*0.6,HALF_CW,HALF_CH,HALF_CH*1.4);
  grad.addColorStop(0,'rgba(0,0,0,0)');
  grad.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,CW,CH);
}

function drawGameOver(){
  ctx.fillStyle='rgba(0,0,0,0.7)';
  ctx.fillRect(0,0,CW,CH);
  ctx.font='bold 48px monospace'; ctx.fillStyle='#ee2222';
  ctx.textAlign='center'; ctx.fillText('GAME OVER',HALF_CW,HALF_CH-20);
  ctx.font='20px monospace'; ctx.fillStyle='#aaa';
  ctx.fillText(`Reached Level ${player.level}  XP: ${player.xp+player.level*100}`,HALF_CW,HALF_CH+20);
  ctx.font='16px monospace'; ctx.fillStyle='#ffdd22';
  ctx.fillText('Press R to restart',HALF_CW,HALF_CH+60);
  ctx.textAlign='left';
}

// ── Reset ──────────────────────────────────────────────────────────────────
function resetGame(){
  player.x=78*TILE+TILE/2; player.y=35*TILE+TILE/2;
  player.hp=100; player.maxHp=100; player.atk=10; player.def=0;
  player.xp=0; player.level=1; player.dead=false;
  player.atkCd=0; player.iFrames=0; player.equip=-1;
  player.inv.fill(null); player.invCount=0;
  enemies.length=0; items.length=0; projs.length=0; floats.length=0;
  spawnTimer=5; gameOver=false;
  spawnInitial();
  spawnInitialItems();
}

// ── Init ───────────────────────────────────────────────────────────────────
generateWorld();
placeBuildings();
carveRoads();
buildMinimap();
spawnNPCs();
spawnInitial();
spawnInitialItems();
requestAnimationFrame(ts=>{lastTime=ts; requestAnimationFrame(update);});
</script>
