<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Top-Down Soccer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0f0f1a;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh; font-family: Arial, sans-serif; user-select: none;
}
h1 {
  color: #fff; font-size: 26px; margin-bottom: 10px;
  letter-spacing: 3px; text-transform: uppercase;
  text-shadow: 0 0 24px rgba(100,220,100,0.45);
}
#ui { display: flex; align-items: center; gap: 18px; margin-bottom: 8px; color: #eee; }
#score {
  font-size: 38px; font-weight: bold; letter-spacing: 8px; color: #fff;
  min-width: 120px; text-align: center; text-shadow: 0 0 12px rgba(255,255,255,0.25);
}
#timer { font-size: 20px; color: #999; font-variant-numeric: tabular-nums; margin-left: 12px; }
.team-badge { padding: 3px 12px; border-radius: 4px; font-size: 13px; font-weight: bold; letter-spacing: 1.5px; }
.team-you { background: #155227; color: #5dfc8a; border: 1px solid #1db954; }
.team-ai  { background: #5a1018; color: #ff8888; border: 1px solid #e63946; }
#staminaBar { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 11px; color: #666; letter-spacing: 1px; text-transform: uppercase; }
#staminaTrack { width: 120px; height: 6px; background: #1a1a2e; border-radius: 3px; overflow: hidden; border: 1px solid #333; }
#staminaFill { height: 100%; width: 100%; background: #1db954; border-radius: 3px; transition: background 0.2s; }
#gameCanvas { border: 3px solid #2a2a3a; border-radius: 6px; display: block; box-shadow: 0 0 50px rgba(0,0,0,0.9); }
#controls { color: #444; font-size: 12px; margin-top: 8px; text-align: center; letter-spacing: 0.5px; }
#controls span { color: #333; margin: 0 4px; }
.wrapper { position: relative; }
#overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.70); color: #fff; border-radius: 4px;
  pointer-events: none; backdrop-filter: blur(3px);
}
#overlay h2 { font-size: 44px; margin-bottom: 10px; text-shadow: 0 0 24px rgba(255,230,50,0.6); }
#overlay p  { font-size: 16px; color: #aaa; letter-spacing: 0.5px; }
</style>
</head>
<body>

<h1>⚽ Top-Down Soccer</h1>
<div id="ui">
  <div class="team-badge team-you">YOU</div>
  <span id="score">0 — 0</span>
  <div class="team-badge team-ai">AI</div>
  <span id="timer">2:00</span>
</div>
<div id="staminaBar">
  <span>Stamina</span>
  <div id="staminaTrack"><div id="staminaFill"></div></div>
</div>
<div class="wrapper">
  <canvas id="gameCanvas" width="800" height="520"></canvas>
  <div id="overlay"><h2>⚽ Kick Off!</h2><p>Get Ready…</p></div>
</div>
<div id="controls">
  WASD / Arrows — Move <span>|</span> Hold Space — Power Shot <span>|</span> Enter — Restart
</div>

<script>
// ============================================================
// PHYSICS
// ============================================================
const FIELD       = { x: 60, y: 40, w: 680, h: 440 };
const GOAL_W      = 120;
const GOAL_D      = 22;
const BALL_R      = 9;
const PLAYER_R    = 15;
const BALL_FRICTION  = 0.962;
const BALL_MIN_SPEED = 0.06;
const BALL_MAX_SPEED = 16;
const WALL_BOUNCE    = 0.52;
const KICK_COOLDOWN  = 0.20;

function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function norm(dx, dy) { const l = Math.hypot(dx, dy) || 1; return [dx/l, dy/l]; }

function clampField(obj, r) {
  obj.x = Math.max(FIELD.x + r, Math.min(FIELD.x + FIELD.w - r, obj.x));
  obj.y = Math.max(FIELD.y + r, Math.min(FIELD.y + FIELD.h - r, obj.y));
}

function capSpeed(obj, max) {
  const spd = Math.hypot(obj.vx, obj.vy);
  if (spd > max) { obj.vx = (obj.vx/spd)*max; obj.vy = (obj.vy/spd)*max; }
}

function tryKick(kicker, ball, power) {
  if ((kicker.kickCooldown||0) > 0) return false;
  if (dist(kicker, ball) > PLAYER_R + BALL_R + 3) return false;
  const spd = Math.hypot(kicker.vx, kicker.vy);
  let kx, ky;
  if (spd > 0.4) {
    const [pvx, pvy] = norm(kicker.vx, kicker.vy);
    const [bx,  by ] = norm(ball.x - kicker.x, ball.y - kicker.y);
    [kx, ky] = norm(pvx*0.75 + bx*0.25, pvy*0.75 + by*0.25);
  } else {
    [kx, ky] = norm(ball.x - kicker.x, ball.y - kicker.y);
  }
  ball.vx = kx * power;
  ball.vy = ky * power;
  kicker.kickCooldown = KICK_COOLDOWN;
  return true;
}

function separateCircles(a, b) {
  const d = dist(a, b), minD = PLAYER_R * 2;
  if (d < minD && d > 0.01) {
    const push = (minD - d)/2 + 0.5;
    const [nx, ny] = norm(b.x - a.x, b.y - a.y);
    a.x -= nx*push; a.y -= ny*push;
    b.x += nx*push; b.y += ny*push;
  }
}

function moveBall(ball) {
  ball.vx *= BALL_FRICTION; ball.vy *= BALL_FRICTION;
  if (Math.abs(ball.vx) < BALL_MIN_SPEED) ball.vx = 0;
  if (Math.abs(ball.vy) < BALL_MIN_SPEED) ball.vy = 0;
  capSpeed(ball, BALL_MAX_SPEED);
  ball.x += ball.vx; ball.y += ball.vy;

  const CY = FIELD.y + FIELD.h/2;
  const gTop = CY - GOAL_W/2, gBot = CY + GOAL_W/2;

  if (ball.y - BALL_R < FIELD.y)           { ball.y = FIELD.y + BALL_R;           ball.vy =  Math.abs(ball.vy)*WALL_BOUNCE; }
  if (ball.y + BALL_R > FIELD.y + FIELD.h) { ball.y = FIELD.y + FIELD.h - BALL_R; ball.vy = -Math.abs(ball.vy)*WALL_BOUNCE; }

  if (ball.x - BALL_R < FIELD.x) {
    if (ball.y > gTop && ball.y < gBot) return 'ai';
    ball.x = FIELD.x + BALL_R; ball.vx = Math.abs(ball.vx)*WALL_BOUNCE;
  }
  if (ball.x + BALL_R > FIELD.x + FIELD.w) {
    if (ball.y > gTop && ball.y < gBot) return 'player';
    ball.x = FIELD.x + FIELD.w - BALL_R; ball.vx = -Math.abs(ball.vx)*WALL_BOUNCE;
  }
  return null;
}

function updateCooldowns(entities, dt) {
  for (const e of entities) if (e.kickCooldown > 0) e.kickCooldown -= dt;
}

// ============================================================
// CHARACTERS & CROWD
// ============================================================
const SKIN = ['#f5c89a','#e8a87c','#c68642','#8d5524'];
const CROWD_COLORS = [
  '#e63946','#1d3557','#f4a261','#2a9d8f','#e9c46a',
  '#264653','#6a4c93','#f72585','#4cc9f0','#ffffff',
  '#ff6b6b','#ffd166','#06d6a0','#118ab2','#ef233c',
];

let crowdPeople = [];

function initCrowd(W, H, FIELD) {
  crowdPeople = [];
  const rows = 3, rowGap = 11;

  for (let row = 0; row < rows; row++) {
    const count = Math.floor((FIELD.w - 20) / 13);
    for (let i = 0; i < count; i++) {
      crowdPeople.push({ x: FIELD.x+10+i*13+(row%2)*6, y: FIELD.y-12-row*rowGap,
        color: CROWD_COLORS[Math.floor(Math.random()*CROWD_COLORS.length)],
        skin: SKIN[Math.floor(Math.random()*SKIN.length)],
        phase: Math.random()*Math.PI*2, speed: 0.8+Math.random()*1.2, cheer: 0 });
    }
  }
  for (let row = 0; row < rows; row++) {
    const count = Math.floor((FIELD.w - 20) / 13);
    for (let i = 0; i < count; i++) {
      crowdPeople.push({ x: FIELD.x+10+i*13+(row%2)*6, y: FIELD.y+FIELD.h+12+row*rowGap,
        color: CROWD_COLORS[Math.floor(Math.random()*CROWD_COLORS.length)],
        skin: SKIN[Math.floor(Math.random()*SKIN.length)],
        phase: Math.random()*Math.PI*2, speed: 0.8+Math.random()*1.2, cheer: 0 });
    }
  }
  for (let row = 0; row < rows; row++) {
    const count = Math.floor((FIELD.h - 20) / 14);
    for (let i = 0; i < count; i++) {
      crowdPeople.push({ x: FIELD.x-12-row*rowGap, y: FIELD.y+10+i*14+(row%2)*6,
        color: '#1db954', skin: SKIN[Math.floor(Math.random()*SKIN.length)],
        phase: Math.random()*Math.PI*2, speed: 0.8+Math.random()*1.2, cheer: 0 });
    }
  }
  for (let row = 0; row < rows; row++) {
    const count = Math.floor((FIELD.h - 20) / 14);
    for (let i = 0; i < count; i++) {
      crowdPeople.push({ x: FIELD.x+FIELD.w+12+row*rowGap, y: FIELD.y+10+i*14+(row%2)*6,
        color: '#e63946', skin: SKIN[Math.floor(Math.random()*SKIN.length)],
        phase: Math.random()*Math.PI*2, speed: 0.8+Math.random()*1.2, cheer: 0 });
    }
  }
}

function triggerCrowdCheer() { for (const p of crowdPeople) p.cheer = 1.5; }

function drawCrowd(ctx, t) {
  for (const p of crowdPeople) {
    const bob  = Math.sin(t * p.speed + p.phase);
    const cheer = Math.max(0, p.cheer);
    if (p.cheer > 0) p.cheer -= 0.012;
    const bobY = p.y - Math.abs(bob)*(1 + cheer*3) - cheer*5;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.ellipse(p.x, bobY+2, 4, 3.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = p.skin;
    ctx.beginPath(); ctx.arc(p.x, bobY-3, 3, 0, Math.PI*2); ctx.fill();
    if (cheer > 0.3) {
      ctx.strokeStyle = p.skin; ctx.lineWidth = 1.5;
      const ar = cheer * 6;
      ctx.beginPath(); ctx.moveTo(p.x-3.5, bobY+1); ctx.lineTo(p.x-6, bobY-ar); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(p.x+3.5, bobY+1); ctx.lineTo(p.x+6, bobY-ar); ctx.stroke();
    }
  }
}

function lighten(hex, amt) {
  let c = hex.replace('#','');
  if (c.length===3) c = c.split('').map(x=>x+x).join('');
  const n = parseInt(c,16);
  const r = Math.min(255,(n>>16)+amt), g = Math.min(255,((n>>8)&0xff)+amt), b = Math.min(255,(n&0xff)+amt);
  return `rgb(${r},${g},${b})`;
}

function drawCharacter(ctx, x, y, angle, jerseyColor, shortsColor, skinTone, number, isPlayer, stamina) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  const R = 15, headR = 7;

  // Shadow
  ctx.save(); ctx.globalAlpha = 0.28; ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(3, 5, R*1.15, R*0.42, 0, 0, Math.PI*2); ctx.fill(); ctx.restore();

  // Boots
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.ellipse(-5, R*0.62, 4, 3,  0.25, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse( 5, R*0.62, 4, 3, -0.25, 0, Math.PI*2); ctx.fill();

  // Socks
  ctx.fillStyle = '#eee';
  ctx.beginPath(); ctx.ellipse(-5, R*0.44, 3.5, 3, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse( 5, R*0.44, 3.5, 3, 0, 0, Math.PI*2); ctx.fill();

  // Shorts
  ctx.fillStyle = shortsColor;
  ctx.beginPath(); ctx.ellipse(0, R*0.28, R*0.6, R*0.52, 0, 0, Math.PI*2); ctx.fill();

  // Jersey
  const jg = ctx.createRadialGradient(-3,-2,1,0,0,R*0.82);
  jg.addColorStop(0, lighten(jerseyColor,30)); jg.addColorStop(1, jerseyColor);
  ctx.fillStyle = jg;
  ctx.beginPath(); ctx.ellipse(0, -R*0.06, R*0.7, R*0.82, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 1.2; ctx.stroke();

  // Number
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.font = `bold ${number>9?6:7}px Arial`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(number, 0, -1);

  // Arms
  ctx.fillStyle = skinTone;
  ctx.beginPath(); ctx.ellipse(-R*0.76, 0, 4, 3.2,  0.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse( R*0.76, 0, 4, 3.2, -0.5, 0, Math.PI*2); ctx.fill();

  // Neck
  ctx.beginPath(); ctx.ellipse(0, -R*0.52, 3, 3, 0, 0, Math.PI*2); ctx.fill();

  // Head
  const hg = ctx.createRadialGradient(-2, -R*0.62-2, 1, 0, -R*0.62, headR);
  hg.addColorStop(0, lighten(skinTone,20)); hg.addColorStop(1, skinTone);
  ctx.fillStyle = hg;
  ctx.beginPath(); ctx.arc(0, -R*0.62, headR, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth = 0.8; ctx.stroke();

  // Hair
  ctx.fillStyle = 'rgba(40,20,0,0.6)';
  ctx.beginPath(); ctx.arc(0, -R*0.62-headR*0.08, headR*0.78, Math.PI*0.9, Math.PI*2.1); ctx.fill();

  // Eyes
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.beginPath(); ctx.arc(-2.5, -R*0.62+1, 1, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc( 2.5, -R*0.62+1, 1, 0, Math.PI*2); ctx.fill();

  // Head shine
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  ctx.beginPath(); ctx.ellipse(-2.2, -R*0.62-3, headR*0.32, headR*0.2, -0.4, 0, Math.PI*2); ctx.fill();

  ctx.restore();

  // Player ring (outside rotation)
  if (isPlayer) {
    ctx.save();
    ctx.strokeStyle = '#ffff33'; ctx.lineWidth = 2;
    ctx.setLineDash([5,4]); ctx.globalAlpha = 0.85;
    ctx.beginPath(); ctx.arc(x, y, R+5, 0, Math.PI*2); ctx.stroke();
    ctx.setLineDash([]); ctx.restore();
  }

  // Stamina bar
  if (stamina !== undefined) {
    const bw = 24, bh = 3, bx = x-bw/2, by = y+R+4;
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = stamina>0.5?'#44ff44':stamina>0.25?'#ffaa00':'#ff3333';
    ctx.fillRect(bx, by, bw*stamina, bh);
  }
}

function drawBall(ctx, ball) {
  const {x, y} = ball, R = 9;
  ctx.save(); ctx.globalAlpha = 0.28; ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(x+3, y+5, R*1.1, R*0.38, 0, 0, Math.PI*2); ctx.fill(); ctx.restore();

  const g = ctx.createRadialGradient(x-3,y-3,1,x,y,R);
  g.addColorStop(0,'#ffffff'); g.addColorStop(0.6,'#e8e8e8'); g.addColorStop(1,'#b0b0b0');
  ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI*2);
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = '#444'; ctx.lineWidth = 1; ctx.stroke();

  ctx.fillStyle = '#111';
  for (const [px,py,pr] of [
    [0,0,R*0.24],[0,-R*0.52,R*0.18],[R*0.5,-R*0.16,R*0.18],
    [R*0.31,R*0.44,R*0.18],[-R*0.31,R*0.44,R*0.18],[-R*0.5,-R*0.16,R*0.18]
  ]) { ctx.beginPath(); ctx.arc(x+px, y+py, pr, 0, Math.PI*2); ctx.fill(); }

  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.beginPath(); ctx.ellipse(x-3, y-3, R*0.28, R*0.18, -0.5, 0, Math.PI*2); ctx.fill();
}

function getFacingAngle(e) {
  if (Math.hypot(e.vx, e.vy) > 0.25) e.angle = Math.atan2(e.vy, e.vx) + Math.PI/2;
  return e.angle || Math.PI/2;
}

// ============================================================
// GAME
// ============================================================
const canvas      = document.getElementById('gameCanvas');
const ctx         = canvas.getContext('2d');
const overlay     = document.getElementById('overlay');
const scoreEl     = document.getElementById('score');
const timerEl     = document.getElementById('timer');
const staminaFill = document.getElementById('staminaFill');

const W = canvas.width, H = canvas.height;
const CX = W/2, CY = H/2;
const MATCH_TIME = 120;

const PLAYER_CFG = { jersey:'#1db954', shorts:'#fff',    skin:SKIN[0], num:10 };
const TM_CFGS = [
  { jersey:'#1db954', shorts:'#fff',    skin:SKIN[1], num:5 },
  { jersey:'#1db954', shorts:'#fff',    skin:SKIN[2], num:7 },
  { jersey:'#f5c300', shorts:'#1db954', skin:SKIN[0], num:1 },
];
const AI_CFGS = [
  { jersey:'#e63946', shorts:'#111',    skin:SKIN[3], num:9 },
  { jersey:'#e63946', shorts:'#111',    skin:SKIN[2], num:4 },
  { jersey:'#e63946', shorts:'#111',    skin:SKIN[1], num:6 },
  { jersey:'#ff7700', shorts:'#e63946', skin:SKIN[2], num:1 },
];

let state, keys = {};

function mkE(x, y, role) {
  return { x, y, vx:0, vy:0, role, angle:Math.PI/2, kickCooldown:0, stamina:1.0 };
}

function initGame() {
  state = {
    time: MATCH_TIME, score:[0,0], phase:'kickoff', phaseTimer:2.2,
    goalFlash:0, goalTeam:-1, powerCharge:0,
    ball: { x:CX, y:CY, vx:0, vy:0 },
    player: mkE(CX-90, CY, 'player'),
    teammates: [ mkE(CX-210, CY-95,'defender'), mkE(CX-210, CY+95,'defender'), mkE(FIELD.x+24, CY,'keeper') ],
    ai: [ mkE(CX+90, CY,'forward'), mkE(CX+210, CY-95,'defender'), mkE(CX+210, CY+95,'defender'), mkE(FIELD.x+FIELD.w-24, CY,'keeper') ],
  };
  updateUI();
  showOverlay('⚽ Kick Off!','Get Ready…');
}

function resetPositions() {
  const b = state.ball;
  b.x=CX; b.y=CY; b.vx=0; b.vy=0;
  const R = [
    [state.player,       CX-90,  CY],
    [state.teammates[0], CX-210, CY-95],
    [state.teammates[1], CX-210, CY+95],
    [state.teammates[2], FIELD.x+24, CY],
    [state.ai[0],        CX+90,  CY],
    [state.ai[1],        CX+210, CY-95],
    [state.ai[2],        CX+210, CY+95],
    [state.ai[3],        FIELD.x+FIELD.w-24, CY],
  ];
  for (const [e,x,y] of R) { e.x=x; e.y=y; e.vx=0; e.vy=0; e.kickCooldown=0; }
}

function allEntities() { return [state.player,...state.teammates,...state.ai]; }

document.addEventListener('keydown', e => {
  keys[e.code]=true;
  if (e.code==='Enter') initGame();
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.code]=false; });

const STAMINA_DRAIN=0.28, STAMINA_REGEN=0.14, STAMINA_MIN=0.15;

function updatePlayer(dt) {
  const p = state.player;
  let dx=0, dy=0;
  if (keys['KeyW']||keys['ArrowUp'])    dy-=1;
  if (keys['KeyS']||keys['ArrowDown'])  dy+=1;
  if (keys['KeyA']||keys['ArrowLeft'])  dx-=1;
  if (keys['KeyD']||keys['ArrowRight']) dx+=1;

  const wantSprint = keys['Space'] && (dx||dy);
  const sprinting  = wantSprint && p.stamina > STAMINA_MIN;

  p.stamina = sprinting
    ? Math.max(0, p.stamina - STAMINA_DRAIN*dt)
    : Math.min(1, p.stamina + STAMINA_REGEN*dt);

  const nearBall = dist(p, state.ball) < PLAYER_R+BALL_R+20;
  if (keys['Space'] && !sprinting && nearBall) {
    state.powerCharge = Math.min(1, (state.powerCharge||0) + dt*1.4);
  } else if (!keys['Space'] && state.powerCharge > 0.1) {
    const power = 8 + state.powerCharge*9;
    p.kickCooldown = 0;
    tryKick(p, state.ball, power);
    state.powerCharge = 0;
  } else if (!keys['Space']) {
    state.powerCharge = 0;
  }

  const topSpeed = sprinting ? 6.2 : 4.2;
  const accel    = sprinting ? 1.3 : 1.0;
  if (dx||dy) {
    const [nx,ny] = norm(dx,dy);
    p.vx += nx*accel; p.vy += ny*accel;
    capSpeed(p, topSpeed);
  } else {
    p.vx *= 0.74; p.vy *= 0.74;
    if (Math.abs(p.vx)<0.08) p.vx=0;
    if (Math.abs(p.vy)<0.08) p.vy=0;
  }
  p.x += p.vx; p.y += p.vy;
  clampField(p, PLAYER_R);

  if (state.powerCharge <= 0.1) tryKick(p, state.ball, sprinting ? 11 : 7.5);

  staminaFill.style.width = (p.stamina*100)+'%';
  staminaFill.style.background = p.stamina>0.5?'#1db954':p.stamina>0.25?'#f0a500':'#e63946';
}

function moveAgent(a, tx, ty, topSpeed) {
  const dx=tx-a.x, dy=ty-a.y;
  if (Math.hypot(dx,dy)<2) return;
  const [nx,ny]=norm(dx,dy);
  a.vx+=nx*0.75; a.vy+=ny*0.75;
  capSpeed(a, topSpeed);
  a.x+=a.vx; a.y+=a.vy;
  a.vx*=0.80; a.vy*=0.80;
  clampField(a, PLAYER_R);
}

function predictBall(ball, ticks) {
  let bx=ball.x, by=ball.y, bvx=ball.vx, bvy=ball.vy;
  for (let i=0;i<ticks;i++) { bvx*=BALL_FRICTION; bvy*=BALL_FRICTION; bx+=bvx; by+=bvy; }
  return {x:bx, y:by};
}

function updateAI(dt) {
  const b = state.ball;

  state.ai.forEach((a, i) => {
    let tx, ty, spd;
    if (a.role==='keeper') {
      tx = FIELD.x+FIELD.w-30;
      if (b.x > FIELD.x+FIELD.w-90) tx = b.x-20;
      ty = Math.max(CY-GOAL_W/2+14, Math.min(CY+GOAL_W/2-14, b.y));
      spd = 4.0;
    } else if (a.role==='forward') {
      const pred = predictBall(b, Math.max(4, Math.floor(dist(a,b)/3.5)));
      tx = Math.max(CX, pred.x); ty = pred.y;
      if (dist(a,b)<PLAYER_R+BALL_R+5) { tx=FIELD.x+40; ty=CY; }
      spd = 3.6;
    } else {
      if (b.x > CX-40) {
        const pred=predictBall(b, Math.max(4,Math.floor(dist(a,b)/3)));
        tx=pred.x; ty=pred.y; spd=3.1;
      } else { tx=CX+190; ty=i===1?CY-95:CY+95; spd=1.6; }
    }
    moveAgent(a, tx, ty, spd);
    if (tryKick(a, b, a.role==='keeper'?9:10)) {
      const spread = a.role==='forward'?30:55;
      const aimY = CY+(Math.random()-0.5)*spread;
      const [nx,ny] = norm(FIELD.x-b.x, aimY-b.y);
      b.vx=nx*(a.role==='forward'?10:9); b.vy=ny*(a.role==='forward'?10:9);
      a.kickCooldown=KICK_COOLDOWN;
    }
  });

  state.teammates.forEach((t, i) => {
    let tx, ty, spd;
    if (t.role==='keeper') {
      tx = FIELD.x+30;
      if (b.x < FIELD.x+90) tx = b.x+20;
      ty = Math.max(CY-GOAL_W/2+14, Math.min(CY+GOAL_W/2-14, b.y));
      spd = 3.8;
    } else {
      if (b.x < CX+40) {
        const pred=predictBall(b, Math.max(4,Math.floor(dist(t,b)/3)));
        tx=pred.x; ty=pred.y; spd=3.0;
      } else { tx=CX-190; ty=i===0?CY-95:CY+95; spd=1.6; }
    }
    moveAgent(t, tx, ty, spd);
    if (tryKick(t, b, 9)) {
      const aimY = CY+(Math.random()-0.5)*35;
      const [nx,ny]=norm((FIELD.x+FIELD.w)-b.x, aimY-b.y);
      b.vx=nx*9; b.vy=ny*9; t.kickCooldown=KICK_COOLDOWN;
    }
  });

  const all=allEntities();
  for (let i=0;i<all.length;i++)
    for (let j=i+1;j<all.length;j++)
      separateCircles(all[i], all[j]);
}

function doScore(team) {
  state.score[team]++;
  state.phase='goal'; state.phaseTimer=3.0;
  state.goalFlash=1.0; state.goalTeam=team;
  triggerCrowdCheer(); updateUI();
  showOverlay(team===0?'🎉 GOAL!':'😬 GOAL!', team===0?'You scored!':'AI scored!');
}
function showOverlay(title, sub) { overlay.innerHTML=`<h2>${title}</h2><p>${sub}</p>`; overlay.style.display='flex'; }
function updateUI() {
  scoreEl.textContent=`${state.score[0]} — ${state.score[1]}`;
  const m=Math.floor(state.time/60), s=Math.floor(state.time%60);
  timerEl.textContent=`${m}:${s.toString().padStart(2,'0')}`;
}

function drawStands() {
  const rows=3, rowGap=11, S=FIELD;
  function stand(x,y,w,h) {
    for (let r=rows-1;r>=0;r--) {
      ctx.fillStyle=`hsl(230,18%,${22+r/(rows-1)*12}%)`;
      if (Math.abs(w)>Math.abs(h)) ctx.fillRect(x, y+(rows-1-r)*rowGap*(h>0?1:-1), w, Math.abs(rowGap));
      else ctx.fillRect(x+(rows-1-r)*rowGap*(w>0?1:-1), y, Math.abs(rowGap), h);
    }
  }
  stand(S.x, S.y-rows*rowGap, S.w, rows*rowGap);
  stand(S.x, S.y+S.h, S.w, rows*rowGap);
  stand(S.x-rows*rowGap, S.y-rows*rowGap, rows*rowGap, S.h+rows*rowGap*2);
  stand(S.x+S.w, S.y-rows*rowGap, rows*rowGap, S.h+rows*rowGap*2);
  ctx.strokeStyle='rgba(255,255,255,0.08)'; ctx.lineWidth=1;
  for (let r=0;r<rows;r++) {
    ctx.beginPath(); ctx.moveTo(S.x,S.y-r*rowGap); ctx.lineTo(S.x+S.w,S.y-r*rowGap); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(S.x,S.y+S.h+r*rowGap); ctx.lineTo(S.x+S.w,S.y+S.h+r*rowGap); ctx.stroke();
  }
}

function drawField() {
  ctx.fillStyle='#2d7a3a'; ctx.fillRect(FIELD.x,FIELD.y,FIELD.w,FIELD.h);
  ctx.fillStyle='#2f8040';
  const sw=FIELD.w/8;
  for (let i=0;i<8;i+=2) ctx.fillRect(FIELD.x+i*sw,FIELD.y,sw,FIELD.h);

  ctx.strokeStyle='rgba(255,255,255,0.88)'; ctx.lineWidth=2.5;
  ctx.strokeRect(FIELD.x,FIELD.y,FIELD.w,FIELD.h);
  ctx.beginPath(); ctx.moveTo(CX,FIELD.y); ctx.lineTo(CX,FIELD.y+FIELD.h); ctx.stroke();
  ctx.beginPath(); ctx.arc(CX,CY,60,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(CX,CY,3.5,0,Math.PI*2); ctx.fill();

  ctx.strokeStyle='rgba(255,255,255,0.7)'; ctx.lineWidth=1.8;
  ctx.strokeRect(FIELD.x,CY-105,95,210);
  ctx.strokeRect(FIELD.x+FIELD.w-95,CY-105,95,210);
  ctx.beginPath(); ctx.arc(FIELD.x+65,CY,40,-Math.PI*0.65,Math.PI*0.65); ctx.stroke();
  ctx.beginPath(); ctx.arc(FIELD.x+FIELD.w-65,CY,40,Math.PI*0.35,Math.PI*1.65); ctx.stroke();

  ctx.fillStyle='rgba(255,255,255,0.75)';
  ctx.beginPath(); ctx.arc(FIELD.x+65,CY,3,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(FIELD.x+FIELD.w-65,CY,3,0,Math.PI*2); ctx.fill();

  const gTop=CY-GOAL_W/2, gBot=CY+GOAL_W/2;
  ctx.fillStyle='rgba(255,255,255,0.07)';
  ctx.fillRect(FIELD.x-GOAL_D,gTop,GOAL_D,GOAL_W);
  ctx.fillRect(FIELD.x+FIELD.w,gTop,GOAL_D,GOAL_W);
  ctx.strokeStyle='rgba(255,255,255,0.15)'; ctx.lineWidth=0.8;
  for (let yy=gTop;yy<=gBot;yy+=15) {
    ctx.beginPath(); ctx.moveTo(FIELD.x-GOAL_D,yy); ctx.lineTo(FIELD.x,yy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(FIELD.x+FIELD.w,yy); ctx.lineTo(FIELD.x+FIELD.w+GOAL_D,yy); ctx.stroke();
  }
  for (let xx=0;xx<GOAL_D;xx+=10) {
    ctx.beginPath(); ctx.moveTo(FIELD.x-GOAL_D+xx,gTop); ctx.lineTo(FIELD.x-GOAL_D+xx,gBot); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(FIELD.x+FIELD.w+xx,gTop); ctx.lineTo(FIELD.x+FIELD.w+xx,gBot); ctx.stroke();
  }
  ctx.strokeStyle='white'; ctx.lineWidth=3.5;
  ctx.beginPath(); ctx.moveTo(FIELD.x,gTop); ctx.lineTo(FIELD.x-GOAL_D,gTop); ctx.lineTo(FIELD.x-GOAL_D,gBot); ctx.lineTo(FIELD.x,gBot); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(FIELD.x+FIELD.w,gTop); ctx.lineTo(FIELD.x+FIELD.w+GOAL_D,gTop); ctx.lineTo(FIELD.x+FIELD.w+GOAL_D,gBot); ctx.lineTo(FIELD.x+FIELD.w,gBot); ctx.stroke();

  ctx.strokeStyle='rgba(255,255,255,0.65)'; ctx.lineWidth=1.5;
  [[FIELD.x,FIELD.y,0,Math.PI/2],[FIELD.x+FIELD.w,FIELD.y,Math.PI/2,Math.PI],
   [FIELD.x,FIELD.y+FIELD.h,3*Math.PI/2,2*Math.PI],[FIELD.x+FIELD.w,FIELD.y+FIELD.h,Math.PI,3*Math.PI/2]]
  .forEach(([cx,cy,a1,a2]) => { ctx.beginPath(); ctx.arc(cx,cy,14,a1,a2); ctx.stroke(); });
}

function drawPowerCharge() {
  if (!state.powerCharge||state.powerCharge<0.05) return;
  const p=state.player, r=PLAYER_R+8+state.powerCharge*8;
  ctx.save(); ctx.globalAlpha=0.8*state.powerCharge;
  ctx.strokeStyle=`hsl(${60-state.powerCharge*60},100%,60%)`;
  ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(p.x,p.y,r,-Math.PI/2,-Math.PI/2+Math.PI*2*state.powerCharge); ctx.stroke();
  ctx.restore();
}

function drawGoalFlash() {
  if (state.goalFlash<=0) return;
  ctx.save(); ctx.globalAlpha=state.goalFlash*0.25;
  ctx.fillStyle=state.goalTeam===0?'#88ff88':'#ff6666';
  ctx.fillRect(0,0,W,H); ctx.restore();
  state.goalFlash-=0.022;
}

let last=0;
function loop(ts) {
  const dt=Math.min((ts-last)/1000,0.05); last=ts;
  ctx.fillStyle='#0f0f1a'; ctx.fillRect(0,0,W,H);
  drawStands();
  drawCrowd(ctx, ts/1000);
  drawField();

  if (state.phase==='kickoff') {
    state.phaseTimer-=dt;
    if (state.phaseTimer<=0) { state.phase='play'; overlay.style.display='none'; }
  } else if (state.phase==='play') {
    updateCooldowns(allEntities(), dt);
    updatePlayer(dt);
    updateAI(dt);
    const scored=moveBall(state.ball);
    if (scored==='player') doScore(0);
    else if (scored==='ai') doScore(1);
    state.time-=dt;
    if (state.time<=0) {
      state.time=0; state.phase='end';
      const [p,a]=state.score;
      showOverlay(p>a?'🏆 You Win!':p<a?'😞 You Lose!':'🤝 Draw!',`Final: ${p} — ${a}  |  Press Enter to restart`);
    }
    updateUI();
  } else if (state.phase==='goal') {
    state.phaseTimer-=dt;
    if (state.phaseTimer<=0) { resetPositions(); state.phase='kickoff'; state.phaseTimer=2.0; showOverlay('⚽ Kick Off!','Get Ready…'); }
  }

  state.teammates.forEach((t,i) => { const c=TM_CFGS[i]; drawCharacter(ctx,t.x,t.y,getFacingAngle(t),c.jersey,c.shorts,c.skin,c.num,false); });
  state.ai.forEach((a,i)         => { const c=AI_CFGS[i]; drawCharacter(ctx,a.x,a.y,getFacingAngle(a),c.jersey,c.shorts,c.skin,c.num,false); });
  const p=state.player;
  drawCharacter(ctx,p.x,p.y,getFacingAngle(p),PLAYER_CFG.jersey,PLAYER_CFG.shorts,PLAYER_CFG.skin,PLAYER_CFG.num,true,p.stamina);
  drawBall(ctx,state.ball);
  drawPowerCharge();
  drawGoalFlash();
  requestAnimationFrame(loop);
}

initCrowd(W,H,FIELD);
initGame();
requestAnimationFrame(loop);
</script>
